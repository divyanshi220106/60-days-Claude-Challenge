<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Operation Lifeline: Supply Chain Crisis Lab</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg: #0b0f1a;
    --surface: #111827;
    --card: #1a2235;
    --card2: #1e2a40;
    --border: #253047;
    --accent: #3b82f6;
    --accent2: #06b6d4;
    --accent3: #8b5cf6;
    --danger: #ef4444;
    --warn: #f59e0b;
    --success: #10b981;
    --text: #f0f4ff;
    --muted: #8899bb;
    --faint: #364260;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    line-height: 1.6;
  }
  #root { min-height: 100vh; }

  /* ── LAYOUT ── */
  .app-wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }
  .phase-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .phase-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 8px;
  }
  .phase-title {
    font-size: 28px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 8px;
  }
  .phase-sub {
    font-size: 15px;
    color: var(--muted);
    max-width: 600px;
    margin: 0 auto;
  }

  /* ── CARDS ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    transition: border-color .2s, transform .15s;
  }
  .card:hover { border-color: var(--accent); }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .mini-card {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .mini-card-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .mini-card-value {
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
  }
  .mini-card-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* ── BUTTONS ── */
  .btn {
    display: inline-block;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: opacity .15s, transform .1s, box-shadow .15s;
    text-align: center;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    color: #fff;
    box-shadow: 0 4px 20px rgba(59,130,246,.35);
  }
  .btn-primary:hover { opacity: .9; box-shadow: 0 6px 28px rgba(59,130,246,.5); }
  .btn-outline {
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--accent);
  }
  .btn-outline:hover { background: rgba(59,130,246,.1); }
  .btn-danger {
    background: var(--danger);
    color: #fff;
  }
  .btn-sm { padding: 8px 18px; font-size: 13px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  /* ── SELECTABLE OPTION ── */
  .option-card {
    background: var(--card2);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    cursor: pointer;
    transition: border-color .2s, background .2s, transform .15s;
    user-select: none;
  }
  .option-card:hover { border-color: var(--accent2); transform: translateY(-2px); }
  .option-card.selected {
    border-color: var(--accent);
    background: rgba(59,130,246,.1);
  }
  .option-card.correct { border-color: var(--success); background: rgba(16,185,129,.1); }
  .option-card.wrong { border-color: var(--danger); background: rgba(239,68,68,.08); }
  .option-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }
  .option-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }
  .option-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    margin-top: 8px;
  }

  /* ── PROGRESS BARS ── */
  .metric-row { margin-bottom: 14px; }
  .metric-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 5px;
    color: var(--muted);
  }
  .metric-label span:last-child { font-weight: 700; color: var(--text); }
  .bar-track {
    height: 8px;
    background: var(--faint);
    border-radius: 99px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 1s cubic-bezier(.4,0,.2,1);
  }

  /* ── BADGES ── */
  .badge {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
  }
  .badge-red { background: rgba(239,68,68,.2); color: #f87171; }
  .badge-orange { background: rgba(245,158,11,.2); color: #fbbf24; }
  .badge-green { background: rgba(16,185,129,.2); color: #34d399; }
  .badge-blue { background: rgba(59,130,246,.2); color: #60a5fa; }
  .badge-purple { background: rgba(139,92,246,.2); color: #a78bfa; }

  /* ── WELCOME ── */
  .welcome-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 40px 20px;
  }
  .welcome-icon {
    font-size: 56px;
    margin-bottom: 24px;
    display: block;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .welcome-title {
    font-size: 38px;
    font-weight: 900;
    background: linear-gradient(135deg, #60a5fa, #06b6d4, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
    line-height: 1.2;
  }
  .welcome-sub {
    font-size: 17px;
    color: var(--muted);
    max-width: 520px;
    margin: 0 auto 32px;
  }
  .feature-row {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
    max-width: 720px;
    margin: 0 auto 36px;
  }
  .feature-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--muted);
  }
  .feature-pill strong { color: var(--text); display: block; font-size: 13px; }

  /* ── CRISIS ALERT ── */
  .crisis-alert {
    background: linear-gradient(135deg, rgba(239,68,68,.15), rgba(245,158,11,.08));
    border: 2px solid rgba(239,68,68,.4);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .crisis-alert::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      45deg, transparent, transparent 8px,
      rgba(239,68,68,.03) 8px, rgba(239,68,68,.03) 16px
    );
  }
  .crisis-title-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .crisis-icon { font-size: 32px; }
  .crisis-name {
    font-size: 22px;
    font-weight: 800;
    color: #f87171;
  }
  .crisis-desc { font-size: 15px; color: var(--muted); position: relative; }

  /* ── NEGOTIATION ── */
  .trust-bar { height: 12px; }
  .round-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 700;
    background: var(--faint);
    color: var(--muted);
    margin-right: 6px;
  }
  .round-chip.done { background: var(--accent); color: #fff; }
  .round-chip.active { background: var(--accent2); color: #000; }

  /* ── SCORE CIRCLE ── */
  .score-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 36px;
    font-weight: 900;
    border: 4px solid;
  }
  .score-circle-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }

  /* ── STEP NAV ── */
  .step-nav {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .step-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--faint);
    transition: background .2s, width .2s;
  }
  .step-dot.done { background: var(--accent); }
  .step-dot.active { background: var(--accent2); width: 24px; border-radius: 4px; }

  /* ── FEEDBACK BOX ── */
  .feedback-box {
    background: var(--card2);
    border-left: 4px solid var(--accent);
    border-radius: 0 12px 12px 0;
    padding: 16px 20px;
    margin-bottom: 12px;
    font-size: 14px;
    color: var(--muted);
  }
  .feedback-box strong { color: var(--text); }

  /* ── DIVIDER ── */
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .welcome-title { font-size: 26px; }
    .phase-title { font-size: 22px; }
    .card-grid { grid-template-columns: 1fr 1fr; }
  }

  /* ── FADE IN ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeUp .45s ease both; }
  .delay-1 { animation-delay: .1s; }
  .delay-2 { animation-delay: .2s; }
  .delay-3 { animation-delay: .3s; }

  /* ── PULSE ── */
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: .5; }
  }
  .pulse { animation: pulse 1.8s ease infinite; }
</style>
</head>

/* ═══════════════ HELPERS ═══════════════ */
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function clamp(v, min=0, max=100) { return Math.max(min, Math.min(max, v)); }

function generateCompany() {
  const industry = pick(INDUSTRIES);
  const countries = [...COUNTRIES].sort(() => .5 - Math.random()).slice(0, rand(2, 4));
  return {
    name: pick(COMPANIES),
    industry: industry.name,
    emoji: industry.emoji,
    revenue: `$${rand(120, 980)}M`,
    factories: rand(2, 9),
    warehouses: rand(5, 22),
    suppliers: rand(40, 280),
    inventoryDays: rand(18, 65),
    leadTime: rand(14, 62),
    countries,
    employees: `${rand(800, 25000).toLocaleString()}`,
  };
}

function generateCrisis() { return pick(CRISES); }

function colorForValue(v) {
  if (v >= 70) return '#10b981';
  if (v >= 40) return '#f59e0b';
  return '#ef4444';
}

function scoreLabel(s) {
  if (s >= 85) return { label: 'Supply Chain Champion', badge: 'badge-green' };
  if (s >= 70) return { label: 'Crisis Resilient Leader', badge: 'badge-blue' };
  if (s >= 50) return { label: 'Developing Executive', badge: 'badge-orange' };
  return { label: 'Learning Through Adversity', badge: 'badge-red' };
}

/* ═══════════════ COMPONENTS ═══════════════ */

function ProgressBar({ value, color }) {
  const [width, setWidth] = useState(0);
  useEffect(() => { const t = setTimeout(() => setWidth(value), 80); return () => clearTimeout(t); }, [value]);
  return (
    <div className="bar-track">
      <div className="bar-fill" style={{ width: `${width}%`, background: color || colorForValue(value) }} />
    </div>
  );
}

function MetricRow({ label, value, color }) {
  return (
    <div className="metric-row">
      <div className="metric-label">
        <span>{label}</span>
        <span>{value}%</span>
      </div>
      <ProgressBar value={value} color={color} />
    </div>
  );
}

function StepNav({ current, total }) {
  return (
    <div className="step-nav">
      {Array.from({ length: total }).map((_, i) => (
        <div key={i} className={`step-dot ${i < current ? 'done' : i === current ? 'active' : ''}`} />

    </div>
  );
}

/* ── PHASE 3: War Room ── */
function WarRoom({ company, crisis, onNext }) {
  const [selected, setSelected] = useState([]);
  const [resolved, setResolved] = useState(false);
  const [metrics, setMetrics] = useState({ cost: 55, inventory: 60, profit: 65, delivery: 70, satisfaction: 68 });
  const [consequenceLog, setConsequenceLog] = useState([]);

  function toggle(action) {
    if (resolved) return;
    setSelected(prev => {
      if (prev.find(a => a.id === action.id)) return prev.filter(a => a.id !== action.id);
      if (prev.length >= 3) return prev;
      return [...prev, action];
    });
  }

  function resolve() {
    const newM = { ...metrics };
    const log = [];
    selected.forEach(a => {
      Object.entries(a.effects).forEach(([k, v]) => {
        newM[k] = clamp(newM[k] + v);
      });
      log.push(`${a.emoji} ${a.title}: ${a.desc}`);
    });
    setMetrics(newM);
    setConsequenceLog(log);
    setResolved(true);
  }

  return (
    <div className="app-wrap fade-in">
      <StepNav current={3} total={8} />
      <div className="phase-header">
        <div className="phase-label">Phase 2 of 7 — War Room</div>
        <h2 className="phase-title">⚔️ Crisis Response War Room</h2>
        <p className="phase-sub">Choose exactly 3 response actions. Each action has real trade-offs — there's no perfect answer. Think about what matters most right now.</p>
      </div>

      {!resolved ? (
        <>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(280px,1fr))', gap: 14, marginBottom: 20 }}>
            {RESPONSE_ACTIONS.map(a => (
              <div key={a.id} className={`option-card ${selected.find(s => s.id === a.id) ? 'selected' : ''}`} onClick={() => toggle(a)}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
                  <span style={{ fontSize: 22 }}>{a.emoji}</span>
                  <span className="option-title">{a.title}</span>
                  {selected.find(s => s.id === a.id) && <span style={{ marginLeft:'auto', color:'var(--accent)', fontSize:18 }}>✓</span>}
                </div>
                <p className="option-desc">{a.desc}</p>
                <div className="feedback-box" style={{ marginTop: 10, marginBottom: 0, padding: '10px 14px' }}>
                  <strong style={{ fontSize: 12, color: 'var(--accent2)' }}>💡 Why this matters: </strong>
                  <span style={{ fontSize: 12 }}>{a.why}</span>
                </div>
                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 10 }}>
                  {Object.entries(a.effects).map(([k, v]) => (
                    <span key={k} className={`badge ${v > 0 ? 'badge-green' : 'badge-red'}`} style={{ fontSize: 11 }}>
                      {k} {v > 0 ? '+' : ''}{v}
                    </span>
                  ))}
                </div>
              </div>
            ))}
          </div>
          <div style={{ textAlign: 'center' }}>
            <p style={{ color: 'var(--muted)', fontSize: 14, marginBottom: 14 }}>
              Selected: <strong style={{ color: 'var(--text)' }}>{selected.length} / 3</strong>
            </p>
            <button className="btn btn-primary" disabled={selected.length !== 3} onClick={resolve}>
              🚀 Execute Response Plan
            </button>
          </div>
        </>
      ) : (
        <>
          <div className="card fade-in">
            <strong style={{ color: 'var(--success)', fontSize: 16 }}>✅ Response Plan Executed</strong>
            <div style={{ marginTop: 16 }}>
              <MetricRow label="Cost Control" value={metrics.cost} />
              <MetricRow label="Inventory Level" value={metrics.inventory} />
              <MetricRow label="Profit Margin" value={metrics.profit} />

}

      <div className="phase-header">
        <div className="phase-label">Phase 5 of 7 — AI Strategy</div>
        <h2 className="phase-title">🤖 AI Investment Decisions</h2>
        <p className="phase-sub">Select 2 AI technologies to deploy. These will shape your long-term supply chain resilience. Budget is limited — choose wisely.</p>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(270px,1fr))', gap: 14, marginBottom: 20 }}>
        {AI_INVESTMENTS.map(inv => (
          <div key={inv.id} className={`option-card ${selected.find(s => s.id === inv.id) ? 'selected' : ''}`} onClick={() => toggle(inv)}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
              <span style={{ fontSize: 28 }}>{inv.emoji}</span>
              <span className="option-title">{inv.title}</span>
              {selected.find(s => s.id === inv.id) && <span style={{ marginLeft:'auto', color:'var(--accent)', fontSize: 18 }}>✓</span>}
            </div>
            <p className="option-desc" style={{ marginBottom: 10 }}>{inv.desc}</p>
            <div className="feedback-box" style={{ marginBottom: 10 }}>
              <strong style={{ fontSize: 12, color: 'var(--success)' }}>📈 Expected Impact: </strong>
              <span style={{ fontSize: 12 }}>{inv.impact}</span>
            </div>
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
              {Object.entries(inv.metrics).map(([k, v]) => (
                <span key={k} className="badge badge-green" style={{ fontSize: 11 }}>+{v}% {k}</span>
              ))}
            </div>
          </div>
        ))}
      </div>
      <div style={{ textAlign: 'center' }}>
        <p style={{ color: 'var(--muted)', fontSize: 14, marginBottom: 14 }}>
          Selected: <strong style={{ color: 'var(--text)' }}>{selected.length} / 2</strong>
        </p>
        <button className="btn btn-primary" disabled={selected.length !== 2} onClick={() => onNext(selected)}>
          📊 View Final Dashboard →
        </button>
      </div>
    </div>
  );
}

/* ── PHASE 7: Final Dashboard ── */
function FinalDashboard({ data, onReplay }) {
  const { company, crisis, warMetrics, negScore, ceoScore, aiInvestments } = data;

  const leadershipScore = Math.round((ceoScore / 100) * 100);
  const negScoreNorm = negScore;
  const costScore = warMetrics.cost;
  const custScore = warMetrics.satisfaction;
  const resilienceScore = Math.round((warMetrics.inventory + warMetrics.delivery) / 2);
  const riskScore = Math.round((negScore + leadershipScore) / 2);
  const overallScore = Math.round((leadershipScore + negScoreNorm + costScore + custScore + resilienceScore + riskScore) / 6);

  const { label, badge } = scoreLabel(overallScore);

  const scoreColor = colorForValue(overallScore);

  const bestDecision = ceoScore >= 80
    ? 'Your CEO boardroom decisions showed exceptional leadership instincts.'
    : negScore >= 75
    ? 'Your supplier negotiation strategy built strong long-term relationships.'
    : 'Your crisis response actions preserved customer satisfaction.';

  const biggestMistake = costScore < 45
    ? 'Cost control was heavily compromised — review your crisis action trade-offs.'
    : leadershipScore < 50
    ? 'Leadership decisions missed key opportunities to build stakeholder trust.'
    : resilienceScore < 50
    ? 'Inventory and delivery resilience suffered — backup supplier speed matters.'
    : 'Overall well balanced — refine your weakest metric area for next time.';

  const recommendation = overallScore >= 80
    ? 'Consider investing in a Supply Chain Control Tower for real-time visibility.'
    : overallScore >= 60
    ? 'Prioritize supplier diversification and multi-sourcing contracts.'
    : 'Start with a Supply Chain Risk Assessment and map your Tier-2 suppliers.';

  const aiNames = aiInvestments.map(a => a.title).join(' + ');

  return (
    <div className="app-wrap fade-in">
      <StepNav current={8} total={8} />
      <div className="phase-header">
        <div className="phase-label">Final Report — {company.emoji} {company.name}</div>
        <h2 className="phase-title">📊 Executive Crisis Dashboard</h2>
        <p className="phase-sub">Here's how you performed across every dimension of this crisis. Your decisions — and their consequences — are all here.</p>
      </div>

      {/* Overall Score */}
      <div className="card" style={{ textAlign: 'center', background: 'linear-gradient(135deg,rgba(59,130,246,.12),rgba(139,92,246,.08))' }}>
        <div className="score-circle" style={{ borderColor: scoreColor, color: scoreColor }}>
          <span>{overallScore}</span>
          <span className="score-circle-label">Score</span>
        </div>
        <span className={`badge ${badge}`} style={{ fontSize: 15, padding: '6px 18px', marginBottom: 8, display:'inline-block' }}>{label}</span>
        <p style={{ color: 'var(--muted)', fontSize: 14 }}>
          Crisis: <strong style={{ color: 'var(--text)' }}>{crisis.emoji} {crisis.name}</strong> ·
          AI Bets: <strong style={{ color: 'var(--text)' }}>{aiNames}</strong>
        </p>
      </div>

      {/* Metric breakdown */}
      <div className="card delay-1">
        <strong style={{ color: 'var(--accent2)', display: 'block', marginBottom: 16 }}>Performance Breakdown</strong>
        <MetricRow label="👔 Leadership Score" value={leadershipScore} />
        <MetricRow label="🤝 Negotiation Score" value={negScoreNorm} />
        <MetricRow label="🛡️ Resilience Score" value={resilienceScore} />
        <MetricRow label="💰 Cost Control" value={costScore} />
        <MetricRow label="📊 Risk Management" value={riskScore} />
        <MetricRow label="⭐ Customer Satisfaction" value={custScore} />
      </div>

      {/* Personalized feedback */}
      <div className="card delay-2">
        <strong style={{ color: 'var(--accent2)', display: 'block', marginBottom: 14 }}>🧠 Executive Debrief</strong>
        <div className="feedback-box">
          <strong>✅ Best Decision: </strong>{bestDecision}
        </div>
        <div className="feedback-box" style={{ borderColor: 'var(--danger)' }}>
          <strong style={{ color: '#f87171' }}>⚠️ Biggest Mistake: </strong>{biggestMistake}
        </div>
        <div className="feedback-box" style={{ borderColor: 'var(--success)' }}>
          <strong style={{ color: 'var(--success)' }}>🚀 Expert Recommendation: </strong>{recommendation}
        </div>
      </div>

      {/* Lessons */}
      <div className="card delay-3">
        <strong style={{ color: 'var(--accent3)', display: 'block', marginBottom: 14 }}>📚 Lessons Learned</strong>
        {[
          'Supply chain resilience isn\'t about preventing disruptions — it\'s about recovering faster than competitors.',
          'Supplier relationships built on trust produce better outcomes than pure price leverage.',
          'Transparent communication during a crisis preserves customer loyalty worth 5-10× the short-term fix.',
          `${aiNames} can reduce future exposure time by 35-60% when deployed with clean data foundations.`,
          'Every day of inaction during a crisis costs more than aggressive early response.',
        ].map((l, i) => (
          <div key={i} style={{ display: 'flex', gap: 10, marginBottom: 10, fontSize: 14, color: 'var(--muted)' }}>
            <span style={{ color: 'var(--accent)', flexShrink: 0 }}>{i + 1}.</span>
            <span>{l}</span>
          </div>
        ))}
      </div>

      <div style={{ textAlign: 'center', marginTop: 32 }}>
        <button className="btn btn-primary" style={{ fontSize: 16, padding: '14px 40px' }} onClick={onReplay}>
          🔁 Replay with New Scenario
        </button>
        <p style={{ color: 'var(--muted)', fontSize: 13, marginTop: 12 }}>Every replay generates a different company, crisis, and outcomes.</p>
      </div>
    </div>
  );
}

/* ═══════════════ APP SHELL ═══════════════ */
function App() {
  const [phase, setPhase] = useState(0);
  const [company, setCompany] = useState(null);
  const [crisis, setCrisis] = useState(null);
  const [warMetrics, setWarMetrics] = useState(null);
  const [negScore, setNegScore] = useState(0);
  const [ceoScore, setCeoScore] = useState(0);
  const [aiInvestments, setAiInvestments] = useState([]);

  function start() {
    setCompany(generateCompany());
    setCrisis(generateCrisis());
    setPhase(1);
  }

  function replay() {
    setPhase(0);
    setCompany(null);
    setCrisis(null);
    setWarMetrics(null);
    setNegScore(0);
    setCeoScore(0);
    setAiInvestments([]);
  }

  if (phase === 0) return <WelcomeScreen onStart={start} />;
  if (phase === 1) return <CompanyProfile company={company} onNext={() => setPhase(2)} />;
  if (phase === 2) return <CrisisAlert company={company} crisis={crisis} onNext={() => setPhase(3)} />;
  if (phase === 3) return <WarRoom company={company} crisis={crisis} onNext={m => { setWarMetrics(m); setPhase(4); }} />;
  if (phase === 4) return <Negotiation onNext={s => { setNegScore(s); setPhase(5); }} />;
  if (phase === 5) return <CEOBoardroom onNext={s => { setCeoScore(s); setPhase(6); }} />;
  if (phase === 6) return <AIStrategy onNext={inv => { setAiInvestments(inv); setPhase(7); }} />;
  if (phase === 7) return <FinalDashboard data={{ company, crisis, warMetrics, negScore, ceoScore, aiInvestments }} onReplay={replay} />;
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

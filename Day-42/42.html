<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ledger — Personal Financial Command Center</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#12141c;
  --surface:#1a1d29;
  --surface-2:#222636;
  --surface-3:#2b2f42;
  --gold:#d4a24e;
  --gold-soft:rgba(212,162,78,.15);
  --teal:#3fa796;
  --teal-soft:rgba(63,167,150,.15);
  --coral:#e8604c;
  --coral-soft:rgba(232,96,76,.15);
  --text:#f2f0e9;
  --text-muted:#9295ab;
  --text-dim:#5c5f74;
  --border:rgba(242,240,233,.08);
  --border-strong:rgba(242,240,233,.16);
  --radius:14px;
  --shadow:0 20px 60px -20px rgba(0,0,0,.6);
  --font-display:'Fraunces',serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
body.light{
  --bg:#f4f2ec;
  --surface:#ffffff;
  --surface-2:#faf8f2;
  --surface-3:#eeebe1;
  --text:#1c1e29;
  --text-muted:#5b5e70;
  --text-dim:#8a8d9e;
  --border:rgba(28,30,41,.08);
  --border-strong:rgba(28,30,41,.14);
  --shadow:0 20px 60px -20px rgba(28,30,41,.18);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  transition:background .3s ease, color .3s ease;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important;} }

::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:10px;}

a{color:inherit;}
button{font-family:inherit;}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; letter-spacing:-.01em;}
.mono{font-family:var(--font-mono);}
.muted{color:var(--text-muted);}

/* ===== App shell ===== */
.app{display:grid; grid-template-columns:76px 1fr; min-height:100vh;}
.app.expanded{grid-template-columns:220px 1fr;}

/* ===== Sidebar: binder tabs ===== */
.sidebar{
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto; overflow-x:hidden;
  z-index:50;
}
.sidebar-head{
  padding:20px 14px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--border);
}
.brand-mark{
  width:34px; height:34px; min-width:34px; border-radius:8px;
  background:linear-gradient(155deg,var(--gold),#a97c2f);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; color:#12141c; font-size:16px;
}
.brand-name{font-family:var(--font-display); font-weight:600; font-size:15px; white-space:nowrap; opacity:0; transition:opacity .2s;}
.app.expanded .brand-name{opacity:1;}
.sidebar-toggle{
  margin-left:auto; background:none; border:none; color:var(--text-muted); cursor:pointer;
  width:26px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:6px;
}
.sidebar-toggle:hover{background:var(--surface-2); color:var(--text);}
.app:not(.expanded) .sidebar-toggle{display:none;}

.tab-list{list-style:none; padding:10px; flex:1; display:flex; flex-direction:column; gap:3px;}
.tab-btn{
  display:flex; align-items:center; gap:12px; width:100%;
  padding:11px 10px; border:none; background:none; cursor:pointer;
  color:var(--text-muted); border-radius:9px; text-align:left;
  font-size:13px; font-weight:500; position:relative; white-space:nowrap;
  transition:background .15s, color .15s;
}
.tab-btn .dot{width:8px; height:8px; border-radius:2px; min-width:8px; background:var(--tab-color,var(--gold)); transition:transform .15s;}
.tab-btn span.label{opacity:0; transition:opacity .15s; overflow:hidden;}
.app.expanded .tab-btn span.label{opacity:1;}
.tab-btn:hover{background:var(--surface-2); color:var(--text);}
.tab-btn.active{background:var(--surface-2); color:var(--text);}
.tab-btn.active .dot{transform:scale(1.4); border-radius:50%;}
.tab-btn.active::before{
  content:''; position:absolute; left:-10px; top:8px; bottom:8px; width:3px;
  background:var(--tab-color,var(--gold)); border-radius:0 3px 3px 0;
}
.sidebar-foot{padding:12px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px;}
.mode-toggle{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px;
  background:var(--surface-2); border:1px solid var(--border); cursor:pointer; color:var(--text-muted);
  font-size:12px; font-weight:600;
}
.mode-toggle:hover{color:var(--text);}

/* ===== Main ===== */
.main{padding:28px 32px 80px; max-width:1180px; width:100%;}
.topbar{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:26px; flex-wrap:wrap;}
.eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); margin-bottom:6px;}
.page-title{font-size:30px;}
.page-sub{color:var(--text-muted); font-size:14px; margin-top:4px; max-width:520px;}
.topbar-actions{display:flex; gap:10px;}
.btn{
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  padding:9px 15px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px; transition:transform .12s, border-color .12s;
}
.btn:hover{border-color:var(--gold); transform:translateY(-1px);}
.btn.primary{background:linear-gradient(155deg,var(--gold),#a97c2f); color:#141621; border:none;}
.btn.primary:hover{filter:brightness(1.08);}
.btn.danger{border-color:var(--coral); color:var(--coral);}
.btn.small{padding:6px 11px; font-size:12px;}

.view{display:none; animation:fadeUp .35s ease;}
.view.active{display:block;}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-span2{grid-column:span 2;}
@media (max-width:980px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} .grid-span2{grid-column:span 1;} }
@media (max-width:640px){ .grid-4{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr;} }

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px; position:relative; overflow:hidden;
}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px;}
.card-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted);}
.card-title.big{font-size:15px; text-transform:none; letter-spacing:0; color:var(--text); font-family:var(--font-display); font-weight:600;}

/* Hero score */
.hero{
  background:linear-gradient(135deg,var(--surface) 0%, var(--surface-2) 100%);
  border:1px solid var(--border); border-radius:20px; padding:28px;
  display:grid; grid-template-columns:auto 1fr; gap:34px; align-items:center; margin-bottom:22px;
}
@media (max-width:760px){ .hero{grid-template-columns:1fr; text-align:center;} .hero .score-wrap{justify-self:center;} }
.score-wrap{position:relative; width:168px; height:168px;}
.score-num{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.score-num .n{font-family:var(--font-display); font-size:44px; font-weight:700; line-height:1;}
.score-num .g{font-family:var(--font-mono); font-size:11px; color:var(--text-muted); letter-spacing:.1em; margin-top:4px;}
.hero-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media (max-width:760px){ .hero-stats{grid-template-columns:1fr 1fr;} }
.stat-block .label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); margin-bottom:6px;}
.stat-block .val{font-family:var(--font-mono); font-size:22px; font-weight:700;}
.stat-block .delta{font-size:12px; margin-top:4px;}
.up{color:var(--teal);} .down{color:var(--coral);}

.badge{font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.05em;}
.badge.good{background:var(--teal-soft); color:var(--teal);}
.badge.warn{background:var(--gold-soft); color:var(--gold);}
.badge.bad{background:var(--coral-soft); color:var(--coral);}

/* progress bar */
.pbar{height:8px; border-radius:6px; background:var(--surface-3); overflow:hidden; margin-top:6px;}
.pbar > div{height:100%; border-radius:6px; transition:width .5s ease;}

/* list rows */
.row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); gap:10px;}
.row:last-child{border-bottom:none;}
.row-left{display:flex; align-items:center; gap:10px; min-width:0;}
.icon-chip{width:34px; height:34px; min-width:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; background:var(--surface-2);}
.row-title{font-size:13.5px; font-weight:600;}
.row-sub{font-size:11.5px; color:var(--text-dim);}
.row-amt{font-family:var(--font-mono); font-weight:700; font-size:14px; white-space:nowrap;}

/* forms */
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:14px;}
label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:6px;}
input,select{
  width:100%; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text);
  padding:9px 11px; border-radius:8px; font-size:13px; font-family:var(--font-body);
}
input:focus,select:focus,button:focus-visible,.tab-btn:focus-visible,.btn:focus-visible{outline:2px solid var(--gold); outline-offset:1px;}
input[type=range]{padding:0; accent-color:var(--gold);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); padding:8px 10px; border-bottom:1px solid var(--border-strong);}
td{padding:10px; border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
.del-btn{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:15px; padding:2px 6px; border-radius:6px;}
.del-btn:hover{color:var(--coral); background:var(--coral-soft);}

.empty{padding:26px 10px; text-align:center; color:var(--text-dim); font-size:13px;}

.insight{
  display:flex; gap:12px; padding:14px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); margin-bottom:10px;
}
.insight .ii{font-size:18px;}
.insight .it{font-size:13px; font-weight:600; margin-bottom:3px;}
.insight .id{font-size:12px; color:var(--text-muted); line-height:1.5;}

.chip{display:inline-block; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:600; background:var(--surface-2); border:1px solid var(--border-strong); margin:2px 4px 2px 0;}

.slider-row{margin-bottom:18px;}
.slider-row .sv{font-family:var(--font-mono); font-weight:700; color:var(--gold);}

.checklist{list-style:none; display:flex; flex-direction:column; gap:2px;}
.checklist li{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border); font-size:13px;}
.checklist li:last-child{border-bottom:none;}
.checklist input{width:16px; height:16px;}

.tip-card{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:14px; height:100%;}
.tip-card .tn{font-family:var(--font-mono); font-size:11px; color:var(--gold); margin-bottom:6px;}

footer.credit{margin-top:40px; padding-top:18px; border-top:1px solid var(--border); color:var(--text-dim); font-size:11.5px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

/* mobile nav */
.mobile-topbar{display:none;}
@media (max-width:820px){
  .app{grid-template-columns:1fr;}
  .app.expanded{grid-template-columns:1fr;}
  .sidebar{position:fixed; left:0; top:0; width:240px; transform:translateX(-100%); transition:transform .25s ease; box-shadow:var(--shadow);}
  .sidebar.open{transform:translateX(0);}
  .sidebar .brand-name, .app .tab-btn span.label{opacity:1;}
  .main{padding:18px 16px 70px;}
  .mobile-topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .hamburger{background:var(--surface); border:1px solid var(--border-strong); border-radius:8px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40;}
  .scrim.show{display:block;}
}

@media print{
  .sidebar,.topbar-actions,.mobile-topbar,.btn,#toast{display:none!important;}
  .app{grid-template-columns:1fr;}
  body{background:#fff; color:#000;}
  .card,.hero{border:1px solid #ccc; box-shadow:none; background:#fff;}
  .view{display:none!important;}
  #view-reports{display:block!important;}
}

#toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--surface-3); border:1px solid var(--border-strong); color:var(--text);
  padding:11px 18px; border-radius:10px; font-size:13px; box-shadow:var(--shadow);
  opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:200;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="scrim" id="scrim" onclick="closeMobileNav()"></div>

<div class="app" id="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand-mark">L</div>
      <div class="brand-name">The Ledger</div>
      <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Collapse sidebar">‹</button>
    </div>
    <ul class="tab-list" id="tabList"></ul>
    <div class="sidebar-foot">
      <button class="mode-toggle" onclick="toggleTheme()" id="themeBtn">
        <span id="themeIcon">☾</span><span class="label-txt">Dark mode</span>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="mobile-topbar">
      <button class="hamburger" onclick="openMobileNav()" aria-label="Open menu">☰</button>
      <div class="brand-mark">L</div>
    </div>

    <div id="views"></div>

    <footer class="credit">
      <span>The Ledger — Personal Financial Command Center · data stays in your browser (localStorage)</span>
      <span id="lastUpdated"></span>
    </footer>
  </main>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   THE LEDGER — Personal Financial Command Center
   Profile: Full-time working student · ₹25k–50k monthly income
   Priority: daily expense tracking & budgeting · building first savings
   ========================================================= */

const CATS = [
  {k:'food', label:'Food & Mess', icon:'🍜', color:'#e8604c'},
  {k:'transport', label:'Transport', icon:'🚌', color:'#d4a24e'},
  {k:'rent', label:'Rent / Hostel', icon:'🏠', color:'#8a6fd4'},
  {k:'education', label:'Education', icon:'📚', color:'#3fa796'},
  {k:'subscriptions', label:'Subscriptions', icon:'📱', color:'#4e91d4'},
  {k:'entertainment', label:'Entertainment', icon:'🎬', color:'#d44ea0'},
  {k:'shopping', label:'Shopping', icon:'🛍️', color:'#d4914e'},
  {k:'misc', label:'Miscellaneous', icon:'🧾', color:'#7a7d92'},
];
const catInfo = k => CATS.find(c=>c.k===k) || CATS[CATS.length-1];
const fmt = n => '₹' + Math.round(n).toLocaleString('en-IN');
const fmtSigned = n => (n<0?'−':'+') + fmt(Math.abs(n));
const todayISO = () => new Date().toISOString().slice(0,10);
const uid = () => Math.random().toString(36).slice(2,10);

function defaultState(){
  const now = new Date();
  const monthTag = (offset)=>{ const d=new Date(now.getFullYear(), now.getMonth()-offset, 1); return d.toISOString().slice(0,7); };
  return {
    profile: { type:'Student', income:'Full-time job while studying', monthlyIncome: 35000, focus:'Tracking daily expenses & staying on budget' },
    incomes: [
      {id:uid(), source:'Job salary', amount:32000, date: monthTag(0)+'-01', recurring:true},
      {id:uid(), source:'Freelance gig', amount:3500, date: monthTag(0)+'-14', recurring:false},
    ],
    expenses: [
      {id:uid(), cat:'rent', desc:'Hostel rent', amount:9000, date: monthTag(0)+'-02'},
      {id:uid(), cat:'food', desc:'Mess + groceries', amount:6200, date: monthTag(0)+'-05'},
      {id:uid(), cat:'transport', desc:'Bus pass + cabs', amount:2100, date: monthTag(0)+'-06'},
      {id:uid(), cat:'subscriptions', desc:'Netflix + Spotify + iCloud', amount:850, date: monthTag(0)+'-08'},
      {id:uid(), cat:'entertainment', desc:'Movies & outings', amount:1800, date: monthTag(0)+'-10'},
      {id:uid(), cat:'education', desc:'Course materials', amount:1400, date: monthTag(0)+'-12'},
      {id:uid(), cat:'shopping', desc:'Clothing', amount:2200, date: monthTag(0)+'-15'},
      {id:uid(), cat:'misc', desc:'Odds & ends', amount:900, date: monthTag(0)+'-18'},
      {id:uid(), cat:'food', desc:'Weekend dining out', amount:1600, date: monthTag(0)+'-20'},
    ],
    budgets: { food:7000, transport:2500, rent:9000, education:1500, subscriptions:1000, entertainment:1500, shopping:2000, misc:1000 },
    savingsGoals: [
      {id:uid(), name:'Emergency Fund', target:20000, saved:4200, due: monthTag(-9)},
      {id:uid(), name:'New Laptop', target:55000, saved:9000, due: monthTag(-6)},
    ],
    debts: [],
    subscriptions: [
      {id:uid(), name:'Netflix', amount:199, cycle:'monthly'},
      {id:uid(), name:'Spotify', amount:119, cycle:'monthly'},
      {id:uid(), name:'iCloud Storage', amount:75, cycle:'monthly'},
      {id:uid(), name:'Campus Gym', amount:500, cycle:'monthly'},
    ],
    checklist: {},
    history: [] // {month, income, expense}
  };
}

let state = load();
function load(){
  try{
    const raw = localStorage.getItem('ledger_state_v1');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return defaultState();
}
function save(){
  localStorage.setItem('ledger_state_v1', JSON.stringify(state));
  document.getElementById('lastUpdated').textContent = 'Last saved ' + new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- derived data ---------- */
function currentMonthTag(){ return new Date().toISOString().slice(0,7); }
function monthTotal(list, tag){
  return list.filter(x => (x.date||'').startsWith(tag)).reduce((s,x)=>s+Number(x.amount),0);
}
function totalIncomeThisMonth(){
  const tag = currentMonthTag();
  let t = state.incomes.filter(i=>i.date.startsWith(tag)).reduce((s,i)=>s+Number(i.amount),0);
  return t || state.profile.monthlyIncome;
}
function totalExpenseThisMonth(){ return monthTotal(state.expenses, currentMonthTag()); }
function totalSubscriptions(){ return state.subscriptions.reduce((s,x)=> s + (x.cycle==='yearly'? x.amount/12 : x.amount),0); }
function totalDebtMonthly(){ return state.debts.reduce((s,d)=>s+Number(d.emi||0),0); }
function totalDebtOutstanding(){ return state.debts.reduce((s,d)=>s+Number(d.balance||0),0); }
function savingsThisMonth(){ return state.savingsGoals.reduce((s,g)=>s+Number(g.saved),0); }
function expenseByCat(){
  const tag = currentMonthTag();
  const map = {};
  CATS.forEach(c=>map[c.k]=0);
  state.expenses.filter(e=>e.date.startsWith(tag)).forEach(e=> map[e.cat] = (map[e.cat]||0)+Number(e.amount));
  return map;
}
function netCashFlow(){ return totalIncomeThisMonth() - totalExpenseThisMonth() - totalDebtMonthly(); }
function savingsRate(){ const inc = totalIncomeThisMonth(); return inc>0 ? Math.max(-100, Math.round((netCashFlow()/inc)*100)) : 0; }

function healthScore(){
  const inc = totalIncomeThisMonth() || 1;
  const sr = netCashFlow()/inc; // savings rate fraction
  let s1 = Math.max(0, Math.min(1, sr / 0.3)) * 40; // 40 pts, target 30% savings

  const byCat = expenseByCat();
  let overBudgetPenalty = 0, budgetCatCount = 0;
  Object.keys(state.budgets).forEach(k=>{
    if(state.budgets[k] > 0){
      budgetCatCount++;
      const ratio = byCat[k] / state.budgets[k];
      if(ratio > 1) overBudgetPenalty += Math.min(1, ratio-1);
    }
  });
  let s2 = budgetCatCount ? Math.max(0, 25 - (overBudgetPenalty/budgetCatCount)*25) : 20;

  const debtRatio = totalDebtMonthly() / inc;
  let s3 = Math.max(0, 20 - debtRatio*100);

  const subRatio = totalSubscriptions() / inc;
  let s4 = Math.max(0, 15 - Math.max(0, subRatio-0.03)*300);

  const total = Math.round(Math.max(0, Math.min(100, s1+s2+s3+s4)));
  return total;
}
function gradeFor(score){
  if(score>=90) return {g:'A+', c:'var(--teal)'};
  if(score>=80) return {g:'A', c:'var(--teal)'};
  if(score>=70) return {g:'B+', c:'var(--teal)'};
  if(score>=60) return {g:'B', c:'var(--gold)'};
  if(score>=50) return {g:'C', c:'var(--gold)'};
  if(score>=35) return {g:'D', c:'var(--coral)'};
  return {g:'F', c:'var(--coral)'};
}

/* ---------- SVG chart helpers (no libraries) ---------- */
function svgDonut(data, size=140, stroke=18){
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  const r = (size-stroke)/2;
  const cx = size/2, cy = size/2;
  const circ = 2*Math.PI*r;
  let offset = 0;
  let paths = '';
  data.forEach(d=>{
    const frac = d.value/total;
    const len = frac*circ;
    paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${stroke}"
      stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}" stroke-linecap="butt" transform="rotate(-90 ${cx} ${cy})" opacity="0.95"/>`;
    offset += len;
  });
  if(data.every(d=>d.value===0)) paths = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${stroke}"/>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}</svg>`;
}
function svgBars(values, labels, w=560, h=190, color='var(--gold)'){
  const max = Math.max(...values, 1);
  const pad = 28, gap = 10;
  const bw = (w - pad*2 - gap*(values.length-1)) / values.length;
  let bars='', labs='';
  values.forEach((v,i)=>{
    const bh = (v/max) * (h - 48);
    const x = pad + i*(bw+gap);
    const y = h - 30 - bh;
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${color}" opacity="${0.55 + 0.45*(v/max)}"/>`;
    bars += `<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="var(--text-muted)">${v>=1000? Math.round(v/1000)+'k': v}</text>`;
    labs += `<text x="${x+bw/2}" y="${h-10}" text-anchor="middle" font-family="Inter" font-size="10.5" fill="var(--text-dim)">${labels[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <line x1="${pad}" y1="${h-30}" x2="${w-pad+10}" y2="${h-30}" stroke="var(--border-strong)"/>
    ${bars}${labs}</svg>`;
}
function svgLine(values, labels, w=560, h=190, color='var(--teal)'){
  const max = Math.max(...values, 1), min = Math.min(...values, 0);
  const pad=30;
  const range = (max-min)||1;
  const stepX = (w - pad*2) / (values.length-1 || 1);
  let pts = values.map((v,i)=>{
    const x = pad + i*stepX;
    const y = h-34 - ((v-min)/range)*(h-64);
    return [x,y];
  });
  let path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  let area = path + ` L${pts[pts.length-1][0]},${h-34} L${pts[0][0]},${h-34} Z`;
  let dots = pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${color}"/>`).join('');
  let labs = pts.map((p,i)=>`<text x="${p[0]}" y="${h-12}" text-anchor="middle" font-family="Inter" font-size="10.5" fill="var(--text-dim)">${labels[i]}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <path d="${area}" fill="${color}" opacity="0.12"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>
    ${dots}${labs}</svg>`;
}
function scoreDial(score){
  const size=168, stroke=14, r=(size-stroke)/2, cx=size/2, cy=size/2, circ=2*Math.PI*r;
  const len = (score/100)*circ;
  const grade = gradeFor(score);
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${stroke}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${grade.c}" stroke-width="${stroke}"
      stroke-dasharray="${len} ${circ-len}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>
  </svg>`;
}

/* ---------- months for trend (last 6, synthesized if missing) ---------- */
function lastMonths(n){
  const arr=[];
  const now = new Date();
  for(let i=n-1;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); arr.push(d.toISOString().slice(0,7)); }
  return arr;
}
function monthLabel(tag){ const [y,m]=tag.split('-'); return new Date(y,m-1,1).toLocaleString('en-IN',{month:'short'}); }
function trendData(){
  const months = lastMonths(6);
  return months.map(tag=>{
    let inc = monthTotal(state.incomes, tag);
    let exp = monthTotal(state.expenses, tag);
    if(inc===0 && exp===0 && tag===currentMonthTag()){ inc = totalIncomeThisMonth(); exp = totalExpenseThisMonth(); }
    if(inc===0 && exp===0){
      // synth mild history around current values for a believable trend on first run
      const base = state.profile.monthlyIncome;
      inc = Math.round(base * (0.94 + Math.random()*0.12));
      exp = Math.round(base * (0.55 + Math.random()*0.25));
    }
    return {tag, label: monthLabel(tag), inc, exp};
  });
}

        <div class="row"><div class="row-title">Future value</div><div class="row-amt mono" style="color:var(--gold)" id="sipFV">—</div></div>
      </div>

        <div id="sipChart"></div>
        <p class="row-sub" style="margin-top:10px;">Beginner tip: SIPs in index funds/mutual funds are a common low-effort way for students to start investing small, consistent amounts. Consult a registered advisor before committing real money.</p>

function updateSip(){
  const amt = Number(document.getElementById('sipAmt').value);
  const ret = Number(document.getElementById('sipRet').value);
  const yrs = Number(document.getElementById('sipYr').value);
  document.getElementById('sipAmtV').textContent = fmt(amt);
  document.getElementById('sipRetV').textContent = ret+'%';
  document.getElementById('sipYrV').textContent = yrs+' year'+(yrs>1?'s':'');
  const months = yrs*12;
  const mRate = ret/100/12;
  let fv, values=[];
  fv = mRate>0 ? amt * ((Math.pow(1+mRate, months)-1) * (1+mRate) / mRate) : amt*months;
  const invested = amt*months;
  for(let y=1;y<=yrs;y++){
    const m=y*12;
    const v = mRate>0 ? amt * ((Math.pow(1+mRate, m)-1) * (1+mRate) / mRate) : amt*m;
    values.push(Math.round(v));
  }
  document.getElementById('sipInvested').textContent = fmt(invested);
  document.getElementById('sipReturns').textContent = fmt(Math.max(0,fv-invested));
  document.getElementById('sipFV').textContent = fmt(fv);
  document.getElementById('sipChart').innerHTML = svgBars(values, values.map((_,i)=>'Y'+(i+1)), 500, 190, 'var(--gold)');
}

        <div class="row"><div class="row-title">New savings rate</div><div class="row-amt mono" id="wfRate">—</div></div>

function updateWhatIf(){
  const cut = Number(document.getElementById('wfCut').value);
  const subCut = Number(document.getElementById('wfSub').value);
  const extraInc = Number(document.getElementById('wfInc').value);
  document.getElementById('wfCutV').textContent = cut+'%';
  document.getElementById('wfSubV').textContent = subCut+'%';
  document.getElementById('wfIncV').textContent = fmt(extraInc);

  const byCat = expenseByCat();
  const discretionary = (byCat.food||0)*0.35 + (byCat.entertainment||0) + (byCat.shopping||0); // portion of food counted as "eating out"
  const discretionarySaved = discretionary * (cut/100);
  const subSaved = totalSubscriptions() * (subCut/100);

  const baseInc = totalIncomeThisMonth();
  const baseExp = totalExpenseThisMonth();
  const currentNet = baseInc - baseExp - totalDebtMonthly();

  const newInc = baseInc + extraInc;
  const newExp = baseExp - discretionarySaved - subSaved;
  const newNet = newInc - newExp - totalDebtMonthly();
  const extra = newNet - currentNet;

  document.getElementById('wfNet').textContent = fmtSigned(newNet);
  document.getElementById('wfExtra').textContent = fmtSigned(extra);
  document.getElementById('wfYear').textContent = fmt(Math.max(0,extra)*12 + Math.max(0,newNet)*12 - Math.max(0,newNet)*12 + Math.max(0,newNet*12));
  document.getElementById('wfRate').textContent = newInc>0? Math.round((newNet/newInc)*100)+'%' : '0%';
  document.getElementById('wfBar').innerHTML = svgBars([Math.max(currentNet,0), Math.max(newNet,0)], ['Current','With changes'], 400, 170, 'var(--teal)');
}

/* ===== INSIGHTS ===== */
function generateInsights(){
  const byCat = expenseByCat();
  const inc = totalIncomeThisMonth();
  const exp = totalExpenseThisMonth();
  const net = netCashFlow();
  const sr = savingsRate();
  const subRatio = inc? (totalSubscriptions()/inc)*100 : 0;
  const insights = [];

  if(sr < 20){
    insights.push({icon:'⚠️', title:'Savings rate below target', body:`You're saving ${sr}% of income this month. Aim for at least 20% — that's roughly ${fmt(inc*0.2)} for you.`});
  } else {
    insights.push({icon:'✅', title:'Healthy savings rate', body:`You're saving ${sr}% of income — ahead of the common 20% guideline. Keep the streak going.`});
  }

  Object.keys(state.budgets).forEach(k=>{
    const bud = state.budgets[k]; const spent = byCat[k]||0;
    if(bud>0 && spent>bud){
      insights.push({icon:'🔴', title:`Over budget on ${catInfo(k).label}`, body:`You've spent ${fmt(spent)} against a ${fmt(bud)} budget — ${fmt(spent-bud)} over.`});
    }
  });

  if(subRatio > 6){
    insights.push({icon:'📱', title:'Subscriptions are creeping up', body:`Recurring subscriptions eat ${Math.round(subRatio)}% of your income (${fmt(totalSubscriptions())}/mo). Review which ones you actually use.`});
  }

  const food = byCat.food||0;
  if(food > (state.budgets.food||Infinity)*0.9 && food>0){
    insights.push({icon:'🍜', title:'Food spend is high', body:`Food & mess costs are ${fmt(food)} this month. Meal-prepping a few days a week is one of the highest-leverage cuts for students.`});
  }

  if(state.savingsGoals.length===0){
    insights.push({icon:'🎯', title:'No savings goal set', body:'Setting a specific goal — even a small one — makes saving far more consistent than a vague "save more" intention.'});
  }

  if(totalDebtOutstanding() > 0 && totalDebtMonthly()/inc > 0.15){
    insights.push({icon:'💳', title:'Debt payments are significant', body:`EMIs take up ${Math.round((totalDebtMonthly()/inc)*100)}% of income. Prioritize paying down the highest-interest balance first.`});
  }

  if(net > 0 && state.savingsGoals.length){
    insights.push({icon:'💡', title:'Put your surplus to work', body:`You have ${fmt(net)} in surplus this month. Consider directing it toward "${state.savingsGoals[0].name}" before it gets spent on discretionary items.`});
  }

  return insights;
}
function viewInsights(){
  const list = generateInsights();
  return `<section class="view" id="view-insights">
    <div class="topbar">
      <div><div class="eyebrow">Rule-based, generated from your data</div><h1 class="page-title">AI Insights</h1><p class="page-sub">Personalized observations recalculated every time your numbers change.</p></div>

}

/* ---------- form wiring & mutations ---------- */
function wireForms(){
  const inc = document.getElementById('incomeForm');
  if(inc) inc.onsubmit = e=>{ e.preventDefault(); const f=new FormData(inc);
    state.incomes.push({id:uid(), source:f.get('source'), amount:Number(f.get('amount')), date:f.get('date'), recurring:false});
    save(); toast('Income added'); renderAll(); showView('income'); };

  const exp = document.getElementById('expenseForm');
  if(exp) exp.onsubmit = e=>{ e.preventDefault(); const f=new FormData(exp);
    state.expenses.push({id:uid(), cat:f.get('cat'), desc:f.get('desc'), amount:Number(f.get('amount')), date:f.get('date')});
    save(); toast('Expense added'); renderAll(); showView('expenses'); };

  const bud = document.getElementById('budgetForm');
  if(bud) bud.onsubmit = e=>{ e.preventDefault(); const f=new FormData(bud);
    CATS.forEach(c=> state.budgets[c.k] = Number(f.get(c.k))||0);
    save(); toast('Budgets saved'); renderAll(); showView('budget'); };

  const goal = document.getElementById('goalForm');
  if(goal) goal.onsubmit = e=>{ e.preventDefault(); const f=new FormData(goal);
    state.savingsGoals.push({id:uid(), name:f.get('name'), target:Number(f.get('target')), saved:Number(f.get('saved'))||0, due:f.get('due')});
    save(); toast('Goal created'); renderAll(); showView('savings'); };

  const debt = document.getElementById('debtForm');
  if(debt) debt.onsubmit = e=>{ e.preventDefault(); const f=new FormData(debt);
    state.debts.push({id:uid(), name:f.get('name'), balance:Number(f.get('balance')), emi:Number(f.get('emi'))||0, rate:Number(f.get('rate'))||0});
    save(); toast('Debt added'); renderAll(); showView('debt'); };

  const sub = document.getElementById('subForm');
  if(sub) sub.onsubmit = e=>{ e.preventDefault(); const f=new FormData(sub);
    state.subscriptions.push({id:uid(), name:f.get('name'), amount:Number(f.get('amount')), cycle:f.get('cycle')});
    save(); toast('Subscription added'); renderAll(); showView('subscriptions'); };

  if(document.getElementById('sipAmt')) updateSip();
  if(document.getElementById('wfCut')) updateWhatIf();
}
function removeItem(listName, id){
  state[listName] = state[listName].filter(x=>x.id!==id);
  save(); toast('Removed'); const active = document.querySelector('.view.active').id.replace('view-','');
  renderAll(); showView(active);
}
function addToGoal(id){
  const input = document.getElementById('add-'+id);
  const amt = Number(input.value);
  if(!amt) return;
  const g = state.savingsGoals.find(g=>g.id===id);
  g.saved += amt;
  save(); toast('Funds added to goal'); renderAll(); showView('savings');
}

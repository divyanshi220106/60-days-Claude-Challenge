<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Detective</title>
<style>
  :root{
    --wood-1:#2b1d14; --wood-2:#3a2818;
    --cork-1:#6b4a2f; --cork-2:#7d5837;
    --paper:#f3e6c8; --paper-dark:#e3d3a8;
    --ink:#2a2016;
    --accent:#d97757; --accent-dim:#a5573c; --glow:rgba(217,119,87,.55);
    --pin:#c0392b;
    --string:#b83b2f;
    --panel:#1b1410; --panel-2:#241a13;
    --gold:#c9a227;
    --font-display: Georgia, 'Times New Roman', serif;
    --font-mono: 'Courier New', Courier, monospace;
  }
  .theme-claude{ --accent:#d97757; --accent-dim:#a5573c; --glow:rgba(217,119,87,.55); --pin:#d97757; --string:#d97757; --gold:#e0a458; }
  .theme-emerald{ --accent:#2fae72; --accent-dim:#1f7d51; --glow:rgba(47,174,114,.5); --pin:#2fae72; --string:#2fae72; --gold:#b7c98a; }
  .theme-crimson{ --accent:#d43f4a; --accent-dim:#9c2b33; --glow:rgba(212,63,74,.5); --pin:#d43f4a; --string:#d43f4a; --gold:#e0b34a; }
  .theme-royal{ --accent:#3d7fd9; --accent-dim:#2a5a9c; --glow:rgba(61,127,217,.5); --pin:#3d7fd9; --string:#3d7fd9; --gold:#c9c9e8; }
  .theme-violet{ --accent:#9d6bd9; --accent-dim:#6f479c; --glow:rgba(157,107,217,.5); --pin:#9d6bd9; --string:#9d6bd9; --gold:#d9b7e8; }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family: var(--font-mono);
    color: var(--paper);
    background: var(--wood-1);
    min-height:100vh;
    overflow-x:hidden;
  }
  #app{ min-height:100vh; position:relative; }

  ::selection{ background: var(--accent); color:#1b1410;}
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background: var(--accent-dim); border-radius:6px; }
  ::-webkit-scrollbar-track{ background: var(--wood-1); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  h1,h2,h3{ font-family: var(--font-display); margin:0; letter-spacing:.02em; }
  a,button{ font-family: inherit; }

  /* ---------- Corkboard background ---------- */
  .corkboard{
    position:absolute; inset:0;
    background-color: var(--cork-1);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,.18) 0, transparent 3%),
      radial-gradient(circle at 65% 15%, rgba(0,0,0,.15) 0, transparent 2.5%),
      radial-gradient(circle at 40% 70%, rgba(0,0,0,.16) 0, transparent 2.8%),
      radial-gradient(circle at 85% 55%, rgba(0,0,0,.14) 0, transparent 2.4%),
      radial-gradient(circle at 10% 85%, rgba(0,0,0,.17) 0, transparent 2.6%),
      radial-gradient(circle at 55% 45%, rgba(0,0,0,.13) 0, transparent 2.2%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 2px, transparent 2px 4px),
      linear-gradient(160deg, var(--cork-2), var(--cork-1));
    background-size: 140px 140px, 160px 160px, 150px 150px, 170px 170px, 130px 130px, 145px 145px, 100% 100%, 100% 100%;
  }
  .corkboard::after{
    content:""; position:absolute; inset:0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.55) 100%);
    pointer-events:none;
  }
  .wood-frame{
    position:absolute; inset:0; pointer-events:none;
    border: 28px solid transparent;
    border-image: linear-gradient(135deg, var(--wood-2), var(--wood-1) 40%, #1a120c 70%, var(--wood-2)) 30;
    box-shadow: inset 0 0 60px rgba(0,0,0,.6);
  }

  .stage{
    position:relative; z-index:2;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 48px 20px;
  }

  .fade-in{ animation: fadeIn .6s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  .pop-in{ animation: popIn .45s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes popIn{ from{opacity:0; transform:scale(.85);} to{opacity:1; transform:scale(1);} }

  /* ---------- Header / brand ---------- */
  .brand{
    position:fixed; top:16px; left:24px; z-index:20;
    display:flex; align-items:center; gap:10px;
    font-family: var(--font-display); font-size:1.05rem; letter-spacing:.06em;
    color: var(--paper); text-shadow:0 2px 6px rgba(0,0,0,.6);
  }
  .brand .lens{
    width:22px;height:22px;border-radius:50%;
    border:3px solid var(--accent);
    position:relative;
  }
  .brand .lens::after{
    content:""; position:absolute; width:12px; height:3px; background:var(--accent);
    right:-9px; bottom:-4px; transform:rotate(45deg); border-radius:2px;
  }
  .hud{
    position:fixed; top:14px; right:24px; z-index:20;
    font-size:.72rem; color: var(--paper-dark); text-align:right; opacity:.85;
  }
  .hud b{ color:var(--accent); }

  /* ---------- Buttons ---------- */
  .btn{
    font-family: var(--font-mono);
    background: linear-gradient(180deg, var(--accent), var(--accent-dim));
    color:#1b1410; border:none; padding:13px 26px; border-radius:6px;
    font-weight:700; letter-spacing:.04em; cursor:pointer; font-size:.9rem;
    box-shadow: 0 6px 0 rgba(0,0,0,.35), 0 0 22px var(--glow);
    transition: transform .15s ease, box-shadow .15s ease;
    text-transform:uppercase;
  }
  .btn:hover{ transform: translateY(-2px); box-shadow: 0 8px 0 rgba(0,0,0,.35), 0 0 30px var(--glow); }
  .btn:active{ transform: translateY(2px); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
  .btn.ghost{
    background:transparent; color:var(--paper); border:2px solid var(--accent-dim);
    box-shadow:none;
  }
  .btn.ghost:hover{ border-color: var(--accent); color:var(--accent); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }

  /* ================= THEME SELECT ================= */
  .theme-select{ text-align:center; max-width:900px; }
  .theme-select .kicker{ color:var(--accent); letter-spacing:.3em; font-size:.72rem; text-transform:uppercase; margin-bottom:10px;}
  .theme-select h1{ font-size:2.6rem; margin-bottom:8px; }
  .theme-select p.sub{ color:var(--paper-dark); margin-bottom:36px; font-size:.95rem; }
  .theme-grid{
    display:grid; grid-template-columns: repeat(5,1fr); gap:16px; margin-bottom:34px;
  }
  @media (max-width:760px){ .theme-grid{ grid-template-columns: repeat(2,1fr);} }
  .theme-card{
    background: var(--panel); border:2px solid #3a2c20; border-radius:10px;
    padding:16px 10px; cursor:pointer; transition: all .2s ease; position:relative;
  }
  .theme-card:hover{ transform: translateY(-4px); border-color: var(--tc-accent); }
  .theme-card.selected{ border-color: var(--tc-accent); box-shadow: 0 0 24px var(--tc-glow); }
  .swatch{ width:100%; height:46px; border-radius:6px; margin-bottom:10px; background: linear-gradient(135deg, var(--tc-accent), var(--tc-dim)); }
  .theme-card .tname{ font-size:.78rem; letter-spacing:.03em; color: var(--paper-dark); }
  .theme-card.selected .tname{ color:var(--paper); font-weight:700; }
  .theme-card .check{ position:absolute; top:8px; right:10px; color:var(--tc-accent); font-size:.8rem; opacity:0; }
  .theme-card.selected .check{ opacity:1; }

  /* ================= CASE FILE / BRIEF (folder) ================= */
  .folder-scene{ perspective: 1600px; }
  .folder{
    width:min(560px,88vw); position:relative;
  }
  .folder-tab{
    background: linear-gradient(180deg,#caa15b,#a97e3d);
    width:150px; height:34px; border-radius:8px 8px 0 0; margin-left:26px;
    display:flex; align-items:center; justify-content:center; color:#3a2818;
    font-size:.72rem; font-weight:700; letter-spacing:.08em; box-shadow: 0 -2px 4px rgba(0,0,0,.15) inset;
  }
  .folder-body{
    background: linear-gradient(160deg,#d8b877,#b8925a);
    border-radius: 4px 12px 12px 12px;
    padding:34px 30px 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,.55), inset 0 0 40px rgba(255,255,255,.08);
    position:relative; color:#3a2818;
  }
  .folder-body::before{
    content:""; position:absolute; inset:10px; border:1px dashed rgba(58,40,24,.35); border-radius:6px; pointer-events:none;
  }
  .brass-clip{
    position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    width:46px; height:22px; border-radius:6px;
    background: linear-gradient(180deg,#f0d27a,#a9822f);
    box-shadow: 0 3px 6px rgba(0,0,0,.4);
  }
  .stamp{
    position:absolute; top:14px; right:18px; border:3px solid var(--accent-dim);
    color: var(--accent-dim); padding:6px 10px; font-weight:800; font-size:.7rem;
    letter-spacing:.12em; transform: rotate(8deg); border-radius:4px; opacity:.85;
    font-family: var(--font-display);
  }
  .case-id{ font-size:.7rem; letter-spacing:.15em; opacity:.7; margin-bottom:6px; text-transform:uppercase;}
  .case-title{ font-family: var(--font-display); font-size:1.6rem; margin-bottom:4px; }
  .case-industry{ font-size:.82rem; opacity:.8; margin-bottom:18px; font-style:italic; }
  .brief-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:10px; }
  @media (max-width:560px){ .brief-grid{ grid-template-columns:1fr; } }
  .brief-field .label{ font-size:.66rem; text-transform:uppercase; letter-spacing:.1em; opacity:.65; margin-bottom:3px;}
  .brief-field .value{ font-size:.85rem; line-height:1.4; }
  .folder-actions{ margin-top:24px; text-align:center; }

  /* ================= INVESTIGATION BOARD ================= */
  .board-wrap{ width:min(1180px,96vw); margin:0 auto; }
  .board-header{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .board-header h2{ font-size:1.5rem; color:var(--paper); }
  .board-header .desc{ font-size:.78rem; color:var(--paper-dark); max-width:520px; }
  .string-note{ font-size:.72rem; color:var(--accent); }

  .board-grid{
    display:grid; grid-template-columns: repeat(3,1fr); gap:26px; position:relative;
  }
  @media (max-width:900px){ .board-grid{ grid-template-columns:1fr; } }

  .evidence-card{
    background: var(--paper);
    color: var(--ink);
    border-radius:3px;
    padding:16px 16px 14px;
    box-shadow: 0 10px 24px rgba(0,0,0,.45);
    position:relative;
    cursor: grab;
    user-select:none;
    transition: box-shadow .2s ease;
    min-height:150px;
  }
  .evidence-card:active{ cursor:grabbing; }
  .evidence-card:nth-child(6n+1){ transform: rotate(-2deg); }
  .evidence-card:nth-child(6n+2){ transform: rotate(1.4deg); }
  .evidence-card:nth-child(6n+3){ transform: rotate(-1deg); }
  .evidence-card:nth-child(6n+4){ transform: rotate(2deg); }
  .evidence-card:nth-child(6n+5){ transform: rotate(-2.6deg); }
  .evidence-card:nth-child(6n+6){ transform: rotate(1deg); }
  .evidence-card.dragging{ z-index:50; box-shadow: 0 22px 46px rgba(0,0,0,.6); transform: scale(1.04) rotate(0deg) !important; }
  .evidence-card.examined{ outline: 2px solid var(--accent); }
  .evidence-card::before{
    content:""; position:absolute; top:-11px; left:50%; transform:translateX(-50%);
    width:16px; height:16px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--pin) 60%, #5a1a12 100%);
    box-shadow: 0 3px 5px rgba(0,0,0,.5);
  }
  .card-label{ font-size:.62rem; text-transform:uppercase; letter-spacing:.1em; color:var(--accent-dim); font-weight:700; margin-bottom:6px; }
  .card-title{ font-family: var(--font-display); font-size:1rem; margin-bottom:8px; }
  .card-body{ font-size:.78rem; line-height:1.5; }
  .card-body ul{ margin:4px 0 0; padding-left:16px; }
  .card-body li{ margin-bottom:3px; }
  .metric-row{ display:flex; justify-content:space-between; border-bottom:1px dotted rgba(0,0,0,.2); padding:3px 0; font-size:.78rem;}
  .quote{ font-style:italic; margin-bottom:6px; padding-left:8px; border-left:2px solid var(--accent-dim); }
  .tape{
    position:absolute; width:60px; height:18px; background: rgba(255,255,255,.55);
    top:-8px; right:14px; transform:rotate(-6deg); box-shadow:0 2px 4px rgba(0,0,0,.2);
  }

  .board-actions{ text-align:center; margin-top:34px; }

  /* ================= SOLVE SCREEN ================= */
  .solve-wrap{ width:min(760px,92vw); }
  .solve-wrap h2{ font-size:1.6rem; margin-bottom:6px; text-align:center; }
  .solve-wrap p.instr{ text-align:center; color:var(--paper-dark); font-size:.85rem; margin-bottom:26px; }
  .options{ display:flex; flex-direction:column; gap:14px; margin-bottom:28px; }
  .option{
    background: var(--panel-2); border:2px solid #3a2c20; border-radius:8px;
    padding:16px 18px; cursor:pointer; transition: all .18s ease; display:flex; gap:14px; align-items:flex-start;
  }
  .option:hover{ border-color: var(--accent-dim); transform: translateX(4px); }
  .option.selected{ border-color: var(--accent); box-shadow: 0 0 20px var(--glow); }
  .option .bullet{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:2px solid var(--accent-dim);
    display:flex; align-items:center; justify-content:center; font-size:.75rem; color:var(--accent-dim); font-weight:700;
  }
  .option.selected .bullet{ background:var(--accent); color:#1b1410; border-color:var(--accent); }
  .option .otext{ font-size:.88rem; line-height:1.4; }
  .solve-actions{ text-align:center; }

  /* ================= VERDICT / CASE CLOSED ================= */
  .verdict-wrap{ width:min(680px,92vw); text-align:center; }
  .stamp-mark{
    display:inline-block; border:6px solid; padding:14px 34px; border-radius:8px;
    font-family: var(--font-display); font-size:2.1rem; letter-spacing:.08em; font-weight:900;
    transform: rotate(-8deg) scale(1.4); opacity:0; margin-bottom:26px;
    animation: stampDown .5s .15s cubic-bezier(.2,.8,.3,1.4) forwards;
  }
  .stamp-mark.correct{ color:#3fae6a; border-color:#3fae6a; text-shadow:0 0 20px rgba(63,174,106,.6); }
  .stamp-mark.wrong{ color:#d43f4a; border-color:#d43f4a; text-shadow:0 0 20px rgba(212,63,74,.6); }
  @keyframes stampDown{ 0%{opacity:0; transform: rotate(-8deg) scale(2.2);} 60%{opacity:1; transform: rotate(-8deg) scale(.94);} 100%{opacity:1; transform: rotate(-8deg) scale(1);} }
  .verdict-card{
    background: var(--paper); color:var(--ink); border-radius:6px; padding:26px 26px 20px; text-align:left;
    box-shadow: 0 16px 40px rgba(0,0,0,.5); margin-bottom:22px;
  }
  .verdict-card h3{ font-family: var(--font-display); margin-bottom:10px; color:var(--accent-dim); }
  .verdict-card p{ font-size:.88rem; line-height:1.55; margin:0 0 12px; }
  .clue-recap{ list-style:none; margin:0; padding:0; }
  .clue-recap li{ font-size:.82rem; margin-bottom:6px; padding-left:20px; position:relative; }
  .clue-recap li::before{ content:"🔍"; position:absolute; left:0; top:0; font-size:.75rem; }

  /* ================= LEARNING REPORT ================= */
  .report-wrap{ width:min(760px,94vw); }
  .report-card{
    background: var(--panel); border:1px solid #3a2c20; border-radius:10px; padding:30px; box-shadow: 0 16px 40px rgba(0,0,0,.5);
  }
  .report-card h2{ font-size:1.4rem; margin-bottom:4px; }
  .report-sub{ font-size:.78rem; color:var(--paper-dark); margin-bottom:22px; }
  .report-section{ margin-bottom:20px; }
  .report-section h4{ font-size:.75rem; text-transform:uppercase; letter-spacing:.1em; color:var(--accent); margin-bottom:8px; }
  .report-section p, .report-section li{ font-size:.86rem; line-height:1.55; color:var(--paper); }
  .improve-list{ margin:0; padding-left:20px; }
  .improve-list li{ margin-bottom:6px; }
  .score-bar{ display:flex; align-items:center; gap:14px; margin-bottom:24px; }
  .score-track{ flex:1; height:10px; background:#0000004d; border-radius:6px; overflow:hidden; }
  .score-fill{ height:100%; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); transition: width .5s ease; }
  .score-num{ font-size:.8rem; color:var(--accent); white-space:nowrap; }
  .report-actions{ display:flex; gap:14px; justify-content:center; margin-top:26px; flex-wrap:wrap; }

  .progress-dots{ display:flex; gap:6px; justify-content:center; margin: 18px 0 4px; }
  .progress-dots span{ width:7px; height:7px; border-radius:50%; background:#5a4530; }
  .progress-dots span.active{ background: var(--accent); box-shadow:0 0 8px var(--glow); }

  .footer-hint{ text-align:center; font-size:.7rem; color:var(--paper-dark); opacity:.7; margin-top:18px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ============================================================
     DATA: 12 fictional marketing cases
  ============================================================ */
  var CASES = [
    {
      company:"BrewHaus Coffee Co.",
      industry:"Food & Beverage",
      objective:"Drive trial of a new $6.50 artisan cold-brew line",
      audience:"Busy young professionals, 25-40, downtown offices",
      channels:["Campus Wi-Fi splash ads","Student radio spots","Instagram Reels","Campus flyers"],
      budget:{"Campus Wi-Fi splash ads":40,"Student radio spots":25,"Instagram Reels":20,"Campus flyers":15},
      metrics:{reach:"412,000",ctr:"1.8%",engagement:"3.1%",conversions:"640",sales:"$4,160"},
      comments:[
        "\"Six fifty for a coffee? I'm a student, not a trust fund kid.\"",
        "\"Saw this ad on the campus wifi login three times a day, kind of annoying.\"",
        "\"Cool branding but way out of my budget between classes.\""
      ],
      social:"High impressions on campus channels, but comment sections are dominated by price complaints from students; almost no engagement from downtown office accounts.",
      mistake:"Audience-channel mismatch",
      clues:[
        "90% of media budget was placed on campus-adjacent channels (Wi-Fi splash, student radio, flyers) despite the audience being defined as working professionals.",
        "Customer comments repeatedly cite price sensitivity typical of students, not the target income bracket.",
        "Reach is high but conversions are low relative to reach, showing the message hit the wrong crowd."
      ],
      explanation:"BrewHaus defined its audience as working professionals but placed the overwhelming majority of spend on campus-oriented channels aimed at students. The product's premium pricing was never going to land with a price-sensitive student audience, producing lots of impressions and noise but few actual buyers.",
      improvements:[
        "Reallocate budget toward channels professionals actually use: LinkedIn, transit ads, office-district geofencing.",
        "Test a lower-priced trial size to widen appeal if student reach is intentional.",
        "Align channel selection with a documented audience profile before media buying, not after."
      ],
      distractors:["Product pricing was too low to seem premium","Campaign ran during a competitor's product recall","Creative assets used the wrong logo file"]
    },
    {
      company:"LunaFit Wearables",
      industry:"Fitness Technology",
      objective:"Launch the LunaBand 3 fitness tracker to existing customers",
      audience:"Health-conscious adults, 22-45, prior LunaFit customers",
      channels:["Email newsletter","Paid social","Influencer partnerships","Press release"],
      budget:{"Email newsletter":20,"Paid social":35,"Influencer partnerships":35,"Press release":10},
      metrics:{reach:"1,120,000",ctr:"0.6%",engagement:"1.2%",conversions:"310",sales:"$46,500"},
      comments:[
        "\"Didn't LunaFit's spokesperson just get exposed for faking his own workout results?\"",
        "\"Hard pass until they distance themselves from that influencer scandal.\"",
        "\"Product looks fine, timing feels tone-deaf.\""
      ],
      social:"Sentiment analysis shows a 3x spike in negative comments the same week the launch went live, referencing an unrelated influencer controversy involving one of the campaign's paid partners.",
      mistake:"Launching during active reputational backlash",
      clues:[
        "Two of the three influencer partners had public controversies breaking in the same week as launch.",
        "Engagement rate collapsed to less than half of LunaFit's historical average launch benchmark.",
        "Comment sentiment trend shows negativity spiking precisely at launch day, not before or after."
      ],
      explanation:"LunaFit moved forward with a pre-scheduled launch date without monitoring real-time brand and influencer sentiment. Because two of its featured influencers were embroiled in public controversy that same week, the campaign's message was drowned out by backlash, and prospective buyers associated the new product with the scandal.",
      improvements:[
        "Build a real-time reputation monitoring checkpoint into the launch approval process.",
        "Have a contingency plan to pause or delay paid amplification if a partner faces controversy.",
        "Diversify spokesperson risk across more, smaller creators rather than concentrated bets."
      ],
      distractors:["The tracker's battery life underperformed competitors","Email open rates were miscalculated by the analytics team","The press release was sent to the wrong journalist list"]
    },
    {
      company:"Nimbus Cloud Storage",
      industry:"B2B SaaS",
      objective:"Generate qualified demo requests from enterprise IT decision-makers",
      audience:"IT Directors and CTOs at companies with 500+ employees",
      channels:["TikTok ads","LinkedIn sponsored posts","Google search ads","Webinar"],
      budget:{"TikTok ads":55,"LinkedIn sponsored posts":15,"Google search ads":20,"Webinar":10},
      metrics:{reach:"2,340,000",ctr:"3.4%",engagement:"5.6%",conversions:"38",sales:"$0 (demo requests only)"},
      comments:[
        "\"Fun video but I manage infrastructure for 3,000 employees, this isn't for me.\"",
        "\"My teenage kid showed me this ad, not sure why I'd get it too.\"",
        "\"Where's the actual enterprise pricing info?\""
      ],
      social:"TikTok engagement is strong among a much younger, largely non-decision-maker demographic; almost no comments come from IT or business job titles.",
      mistake:"Wrong channel mix for a B2B enterprise audience",
      clues:[
        "55% of spend went to TikTok, a platform whose core audience skews toward consumers far younger than the IT Director/CTO buyer.",
        "Engagement and reach are the campaign's best numbers, but conversions to qualified demo requests are extremely low.",
        "LinkedIn, the channel most used by the actual target buyer, received the smallest share of budget."
      ],
      explanation:"Nimbus optimized for reach and engagement metrics that TikTok delivers cheaply, but the platform's audience does not match enterprise IT decision-makers. Vanity metrics looked great while the channel best suited to reach the real buyer, LinkedIn, was starved of budget.",
      improvements:[
        "Shift majority budget to LinkedIn and targeted search ads where IT decision-makers actually spend time.",
        "Use TikTok, if at all, for brand awareness only, not lead generation, with separate KPIs.",

  var THEMES = [
    {id:"claude", name:"Claude Orange", cls:"theme-claude", accent:"#d97757", dim:"#a5573c", glow:"rgba(217,119,87,.5)"},
    {id:"emerald", name:"Emerald Noir", cls:"theme-emerald", accent:"#2fae72", dim:"#1f7d51", glow:"rgba(47,174,114,.5)"},
    {id:"crimson", name:"Crimson File", cls:"theme-crimson", accent:"#d43f4a", dim:"#9c2b33", glow:"rgba(212,63,74,.5)"},
    {id:"royal", name:"Royal Ledger", cls:"theme-royal", accent:"#3d7fd9", dim:"#2a5a9c", glow:"rgba(61,127,217,.5)"},
    {id:"violet", name:"Violet Dusk", cls:"theme-violet", accent:"#9d6bd9", dim:"#6f479c", glow:"rgba(157,107,217,.5)"}
  ];

  /* ============================================================
     STATE
  ============================================================ */
  var state = {
    screen: "theme",
    theme: null,
    usedIndices: [],
    currentCase: null,
    options: [],
    selectedOption: null,
    examinedCards: {},
    stats: { attempted: 0, solved: 0 }
  };

  var app = document.getElementById("app");

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function pickCase(){
    if(state.usedIndices.length >= CASES.length){ state.usedIndices = []; }
    var pool = [];
    for(var i=0;i<CASES.length;i++){ if(state.usedIndices.indexOf(i) === -1) pool.push(i); }
    var idx = pool[Math.floor(Math.random()*pool.length)];
    state.usedIndices.push(idx);
    return CASES[idx];
  }

  function buildOptions(c){
    var opts = shuffle([c.mistake].concat(c.distractors));
    return opts;
  }

  /* ============================================================
     RENDER HELPERS
  ============================================================ */
  function el(tag, attrs, html){
    var e = document.createElement(tag);
    if(attrs) for(var k in attrs){ e.setAttribute(k, attrs[k]); }
    if(html !== undefined) e.innerHTML = html;
    return e;
  }

  function chrome(){
    var wrap = document.createElement("div");
    wrap.className = "corkboard";
    var frame = el("div",{"class":"wood-frame"});
    var brand = el("div",{"class":"brand"},'<span class="lens"></span> MARKETING DETECTIVE');
    var hud = el("div",{"class":"hud"}, "CASES SOLVED <b>"+state.stats.solved+"</b> / "+state.stats.attempted+" ATTEMPTED");
    app.appendChild(wrap);
    app.appendChild(frame);
    app.appendChild(brand);
    if(state.screen !== "theme") app.appendChild(hud);
  }

  function progressDots(activeIdx){
    var labels = ["Case File","Investigation","Solve","Verdict","Report"];
    var wrap = el("div",{"class":"progress-dots"});
    for(var i=0;i<labels.length;i++){
      var d = el("span",{});
      if(i === activeIdx) d.className = "active";
      wrap.appendChild(d);
    }
    return wrap;
  }

  function render(){
    app.innerHTML = "";
    app.className = state.theme ? state.theme.cls : "";
    chrome();
    var stage = el("div",{"class":"stage"});
    app.appendChild(stage);

    if(state.screen === "theme") renderTheme(stage);
    else if(state.screen === "brief") renderBrief(stage);
    else if(state.screen === "board") renderBoard(stage);
    else if(state.screen === "solve") renderSolve(stage);
    else if(state.screen === "verdict") renderVerdict(stage);
    else if(state.screen === "report") renderReport(stage);
  }

  /* ---------- THEME SELECT ---------- */
  function renderTheme(stage){
    var wrap = el("div",{"class":"theme-select fade-in"});
    wrap.innerHTML =
      '<div class="kicker">Case Onboarding</div>' +
      '<h1>Choose Your Case File Theme</h1>' +
      '<p class="sub">Every detective has a signature palette. Pick the file color that will follow you through the investigation.</p>';
    var grid = el("div",{"class":"theme-grid"});
    THEMES.forEach(function(t){
      var card = el("div",{"class":"theme-card"});
      card.style.setProperty("--tc-accent", t.accent);
      card.style.setProperty("--tc-dim", t.dim);
      card.style.setProperty("--tc-glow", t.glow);
      if(state.theme && state.theme.id === t.id) card.className += " selected";
      card.innerHTML = '<div class="swatch"></div><div class="tname">'+t.name+'</div><div class="check">&#10003; selected</div>';
      card.addEventListener("click", function(theme){
        return function(){
          state.theme = theme;
          render();
        };
      }(t));
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    var btn = el("button",{"class":"btn"}, "Accept First Investigation");
    if(!state.theme) btn.disabled = true;
    btn.addEventListener("click", function(){
      if(!state.theme) return;
      state.currentCase = pickCase();
      state.stats.attempted++;
      state.selectedOption = null;
      state.examinedCards = {};
      state.screen = "brief";
      render();
    });
    wrap.appendChild(btn);
    stage.appendChild(wrap);
  }

  /* ---------- CASE BRIEF (folder) ---------- */
  function renderBrief(stage){
    var c = state.currentCase;
    var scene = el("div",{"class":"folder-scene pop-in"});
    var folder = el("div",{"class":"folder"});
    folder.innerHTML =
      '<div class="folder-tab">CASE FILE</div>' +
      '<div class="folder-body">' +
        '<div class="brass-clip"></div>' +
        '<div class="stamp">CONFIDENTIAL</div>' +
        '<div class="case-id">Case #'+(state.stats.attempted).toString().padStart(3,'0')+' &mdash; Open Investigation</div>' +
        '<div class="case-title">'+c.company+'</div>' +
        '<div class="case-industry">'+c.industry+'</div>' +
        '<div class="brief-grid">' +
          field("Objective", c.objective) +
          field("Target Audience", c.audience) +
          field("Channels Used", c.channels.join(", ")) +
          field("Budget Split", Object.keys(c.budget).map(function(k){ return k+": "+c.budget[k]+"%"; }).join(" &middot; ")) +
        '</div>' +
      '</div>';
    var actions = el("div",{"class":"folder-actions"});
    var btn = el("button",{"class":"btn"}, "Open Investigation Board");
    btn.addEventListener("click", function(){
      state.screen = "board";
      render();
    });
    actions.appendChild(btn);
    actions.appendChild(progressDots(0));
    scene.appendChild(folder);
    scene.appendChild(actions);
    stage.appendChild(scene);

    function field(label, value){
      return '<div class="brief-field"><div class="label">'+label+'</div><div class="value">'+value+'</div></div>';
    }
  }

  /* ---------- INVESTIGATION BOARD ---------- */
  function renderBoard(stage){
    var c = state.currentCase;
    var wrap = el("div",{"class":"board-wrap fade-in"});

    var header = el("div",{"class":"board-header"});
    header.innerHTML =
      '<div><h2>Investigation Board</h2><div class="desc">Drag the evidence cards around the corkboard. Examine every piece before you name the primary marketing mistake.</div></div>' +
      '<div class="string-note">Pin count: '+Object.keys(state.examinedCards).length+' / 6 examined</div>';
    wrap.appendChild(header);

    var grid = el("div",{"class":"board-grid"});

    var cards = [];
    cards.push(makeCard("metrics", "Campaign Metrics", metricsHtml(c)));
    cards.push(makeCard("comments", "Customer Comments", commentsHtml(c)));
    cards.push(makeCard("social", "Social Performance", '<div class="card-body">'+c.social+'</div>'));
    c.clues.forEach(function(clue, i){
      cards.push(makeCard("clue"+i, "Clue "+(i+1), '<div class="card-body">'+clue+'</div>'));
    });

    cards.forEach(function(cardEl){ grid.appendChild(cardEl); });
    wrap.appendChild(grid);

    var actions = el("div",{"class":"board-actions"});
    var btn = el("button",{"class":"btn"}, "I'm Ready to Solve the Case");
    btn.addEventListener("click", function(){
      state.options = buildOptions(c);
      state.screen = "solve";
      render();
    });
    actions.appendChild(btn);
    actions.appendChild(progressDots(1));
    wrap.appendChild(actions);

    stage.appendChild(wrap);
    enableDrag(grid);

    function makeCard(key, label, bodyHtml){
      var card = el("div",{"class":"evidence-card","data-key":key});
      if(state.examinedCards[key]) card.className += " examined";
      card.innerHTML = '<div class="card-label">'+label+'</div>' + bodyHtml;
      card.addEventListener("pointerdown", function(){
        state.examinedCards[key] = true;
      });
      return card;
    }
  }

  function metricsHtml(c){
    var rows = "";
    var m = c.metrics;
    ["reach","ctr","engagement","conversions","sales"].forEach(function(k){
      var lbl = k === "ctr" ? "CTR" : (k.charAt(0).toUpperCase()+k.slice(1));
      rows += '<div class="metric-row"><span>'+lbl+'</span><span>'+m[k]+'</span></div>';
    });
    return '<div class="card-body">'+rows+'</div>';
  }

  function commentsHtml(c){
    var out = "";
    c.comments.forEach(function(q){ out += '<div class="quote">'+q+'</div>'; });
    return '<div class="card-body">'+out+'</div>';
  }

  function enableDrag(container){
    var dragEl = null, offX = 0, offY = 0;
    container.querySelectorAll(".evidence-card").forEach(function(card){
      card.style.position = "relative";
      card.addEventListener("pointerdown", function(e){
        dragEl = card;
        card.setPointerCapture(e.pointerId);
        card.classList.add("dragging");
        var rect = card.getBoundingClientRect();
        offX = e.clientX - rect.left;
        offY = e.clientY - rect.top;
        card.style.zIndex = 50;
      });
      card.addEventListener("pointermove", function(e){
        if(dragEl !== card) return;
        var parentRect = container.getBoundingClientRect();
        var x = e.clientX - parentRect.left - offX;
        var y = e.clientY - parentRect.top - offY;
        card.style.position = "absolute";
        card.style.left = Math.max(0, x) + "px";
        card.style.top = Math.max(0, y) + "px";
      });
      card.addEventListener("pointerup", function(e){
        if(dragEl === card){
          card.classList.remove("dragging");
          dragEl = null;
        }
      });
    });
  }

  /* ---------- SOLVE SCREEN ---------- */
  function renderSolve(stage){
    var c = state.currentCase;
    var wrap = el("div",{"class":"solve-wrap fade-in"});
    wrap.innerHTML = '<h2>What is the primary marketing mistake?</h2><p class="instr">Review your evidence and choose the one explanation the data actually supports.</p>';
    var optWrap = el("div",{"class":"options"});
    state.options.forEach(function(opt, i){
      var o = el("div",{"class":"option","data-i":i});
      o.innerHTML = '<div class="bullet">'+String.fromCharCode(65+i)+'</div><div class="otext">'+opt+'</div>';
      o.addEventListener("click", function(){
        state.selectedOption = opt;
        optWrap.querySelectorAll(".option").forEach(function(x){ x.classList.remove("selected"); });
        o.classList.add("selected");
        submitBtn.disabled = false;
      });
      optWrap.appendChild(o);
    });
    wrap.appendChild(optWrap);
    var actions = el("div",{"class":"solve-actions"});
    var submitBtn = el("button",{"class":"btn"}, "Close the Case");
    submitBtn.disabled = true;
    submitBtn.addEventListener("click", function(){
      state.screen = "verdict";
      render();
    });
    actions.appendChild(submitBtn);
    actions.appendChild(progressDots(2));
    wrap.appendChild(actions);
    stage.appendChild(wrap);
  }

  /* ---------- VERDICT ---------- */
  function renderVerdict(stage){
    var c = state.currentCase;
    var correct = state.selectedOption === c.mistake;
    if(correct) state.stats.solved++;
    var wrap = el("div",{"class":"verdict-wrap fade-in"});
    var stamp = el("div",{"class":"stamp-mark "+(correct?"correct":"wrong")}, correct ? "CASE CLOSED" : "CASE MISFILED");
    wrap.appendChild(stamp);

    var card = el("div",{"class":"verdict-card"});
    card.innerHTML =
      '<h3>'+(correct ? "You nailed it." : "Not quite &mdash; here's what really happened.")+'</h3>' +
      '<p><strong>Primary mistake:</strong> '+c.mistake+'</p>' +
      '<p>'+c.explanation+'</p>' +
      '<p><strong>Supporting clues:</strong></p>' +
      '<ul class="clue-recap">' + c.clues.map(function(cl){ return '<li>'+cl+'</li>'; }).join("") + '</ul>';
    wrap.appendChild(card);

    var actions = el("div",{"class":"folder-actions"});
    var btn = el("button",{"class":"btn"}, "View Learning Report");
    btn.addEventListener("click", function(){
      state.screen = "report";
      render();
    });
    actions.appendChild(btn);
    actions.appendChild(progressDots(3));
    wrap.appendChild(actions);
    stage.appendChild(wrap);
  }

  /* ---------- LEARNING REPORT ---------- */
  function renderReport(stage){
    var c = state.currentCase;
    var wrap = el("div",{"class":"report-wrap fade-in"});
    var card = el("div",{"class":"report-card"});
    var pct = Math.round((state.stats.solved/state.stats.attempted)*100);

    card.innerHTML =
      '<h2>Marketing Learning Report</h2>' +
      '<div class="report-sub">'+c.company+' &middot; '+c.industry+'</div>' +
      '<div class="score-bar"><div class="score-track"><div class="score-fill" style="width:'+pct+'%"></div></div><div class="score-num">'+state.stats.solved+' / '+state.stats.attempted+' solved ('+pct+'%)</div></div>' +
      '<div class="report-section"><h4>The Mistake</h4><p>'+c.mistake+'</p></div>' +
      '<div class="report-section"><h4>Why It Happened</h4><p>'+c.explanation+'</p></div>' +
      '<div class="report-section"><h4>How To Fix It</h4><ul class="improve-list">' + c.improvements.map(function(i){ return '<li>'+i+'</li>'; }).join("") + '</ul></div>';
    wrap.appendChild(card);

    var actions = el("div",{"class":"report-actions"});
    var replay = el("button",{"class":"btn"}, "Take Another Case");
    replay.addEventListener("click", function(){
      state.currentCase = pickCase();
      state.stats.attempted++;
      state.selectedOption = null;
      state.examinedCards = {};
      state.screen = "brief";
      render();
    });
    var themeBtn = el("button",{"class":"btn ghost"}, "Change Theme");
    themeBtn.addEventListener("click", function(){
      state.screen = "theme";
      render();
    });
    actions.appendChild(replay);
    actions.appendChild(themeBtn);
    wrap.appendChild(actions);
    wrap.appendChild(progressDots(4));
    var hint = el("div",{"class":"footer-hint"}, "Tip: take a screenshot of this report before starting a new case.");
    wrap.appendChild(hint);
    stage.appendChild(wrap);
  }

  render();
})();
</script>
</body>
</html>

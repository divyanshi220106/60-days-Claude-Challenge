<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defend Your Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F7F4;
  --paper-2:#EFEFEA;
  --card:#FFFFFF;
  --ink:#1B1D1B;
  --ink-soft:#5C615D;
  --ink-faint:#93968F;
  --line:#DEDFDA;
  --line-soft:#E9E9E4;
  --authority:#33475B;
  --authority-soft:#5D7A93;
  --authority-wash:#EAEFF2;
  --strong:#3F6B4B;
  --strong-wash:#E7F0E9;
  --watch:#A8752F;
  --watch-wash:#F5EDDD;
  --weak:#AD4A47;
  --weak-wash:#F6E8E7;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 1px 2px rgba(27,29,27,0.04), 0 8px 24px rgba(27,29,27,0.05);
  --serif:'Fraunces', Georgia, serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
}
button{font-family:inherit;cursor:pointer;}
textarea,input{font-family:inherit;}
::selection{background:var(--authority-wash);color:var(--authority);}
:focus-visible{outline:2px solid var(--authority-soft); outline-offset:2px;}

#app{min-height:100vh;display:flex;flex-direction:column;}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;border-bottom:1px solid var(--line-soft);
  background:var(--paper);position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:26px;height:26px;border-radius:6px;background:var(--authority);
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-family:var(--mono);font-size:12px;font-weight:500;
}
.brand-name{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-0.01em;}
.topbar-actions{display:flex;gap:10px;align-items:center;}
.pill-btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500;
  transition:border-color .15s,color .15s;
}
.pill-btn:hover{border-color:var(--authority-soft);color:var(--authority);}

/* ---------- Layout shell ---------- */
.screen{flex:1;display:flex;flex-direction:column;}
.center-col{max-width:760px;margin:0 auto;width:100%;padding:0 24px;}

/* ---------- Intro / Hero ---------- */
.hero{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:80px 24px 60px;max-width:820px;margin:0 auto;width:100%;
}
.hero-eyebrow{
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--authority-soft);margin-bottom:18px;display:flex;align-items:center;gap:8px;
}
.hero-eyebrow::before{content:"";width:16px;height:1px;background:var(--authority-soft);display:inline-block;}
.hero h1{
  font-family:var(--serif);font-weight:500;font-size:clamp(34px,5vw,54px);
  line-height:1.08;letter-spacing:-0.015em;margin:0 0 22px;
}
.hero h1 em{font-style:italic;color:var(--authority);}
.hero p.lede{
  font-size:17px;line-height:1.65;color:var(--ink-soft);max-width:560px;margin:0 0 36px;
}
.hero-note{
  font-size:13.5px;color:var(--ink-faint);line-height:1.6;max-width:520px;margin-bottom:36px;
  border-left:2px solid var(--line);padding-left:14px;
}
.btn-primary{
  background:var(--authority);color:#fff;border:none;padding:13px 26px;border-radius:var(--radius-sm);
  font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;
  transition:background .15s,transform .15s;
}
.btn-primary:hover{background:#28394A;transform:translateY(-1px);}
.btn-primary:active{transform:translateY(0);}
.btn-secondary{
  background:transparent;color:var(--ink-soft);border:1px solid var(--line);padding:12px 22px;
  border-radius:var(--radius-sm);font-size:14px;font-weight:500;transition:all .15s;
}
.btn-secondary:hover{border-color:var(--authority-soft);color:var(--authority);}
.hero-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}

.hero-history{
  margin-top:44px;padding-top:28px;border-top:1px solid var(--line-soft);
}
.hero-history-title{font-size:12px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;font-family:var(--mono);}
.history-row{
  display:flex;align-items:center;justify-content:space-between;padding:12px 0;
  border-bottom:1px solid var(--line-soft);font-size:14px;
}
.history-row:last-child{border-bottom:none;}
.history-row-left{display:flex;flex-direction:column;gap:2px;}
.history-row-title{font-weight:500;}
.history-row-meta{font-size:12.5px;color:var(--ink-faint);}
.history-row-link{color:var(--authority);font-size:13px;font-weight:600;background:none;border:none;padding:6px 10px;}
.history-row-link:hover{text-decoration:underline;}

/* ---------- Wizard (setup MCQs) ---------- */
.wizard{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;}
.wizard-card{max-width:560px;width:100%;}
.wizard-progress{display:flex;gap:6px;margin-bottom:32px;}
.wizard-dot{height:3px;flex:1;background:var(--line);border-radius:2px;overflow:hidden;}
.wizard-dot.done{background:var(--authority);}
.wizard-q{font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.3;margin:0 0 8px;letter-spacing:-0.01em;}
.wizard-sub{color:var(--ink-soft);font-size:14.5px;margin:0 0 28px;line-height:1.5;}
.wizard-options{display:flex;flex-direction:column;gap:10px;}
.wizard-opt{
  text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:16px 18px;font-size:15px;font-weight:500;color:var(--ink);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  transition:border-color .15s,background .15s;
}
.wizard-opt:hover{border-color:var(--authority-soft);background:var(--authority-wash);}
.wizard-opt-desc{display:block;font-size:12.5px;font-weight:400;color:var(--ink-faint);margin-top:3px;}
.wizard-opt-arrow{opacity:0;transition:opacity .15s;color:var(--authority);}
.wizard-opt:hover .wizard-opt-arrow{opacity:1;}
.wizard-back{margin-top:24px;background:none;border:none;color:var(--ink-faint);font-size:13px;display:flex;align-items:center;gap:5px;}
.wizard-back:hover{color:var(--authority);}

/* ---------- Upload screen ---------- */
.upload-wrap{flex:1;padding:48px 24px;max-width:680px;margin:0 auto;width:100%;}
.upload-title{font-family:var(--serif);font-size:28px;font-weight:500;margin:0 0 8px;letter-spacing:-0.01em;}
.upload-sub{color:var(--ink-soft);font-size:14.5px;margin:0 0 30px;line-height:1.55;}
.dropzone{
  border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--card);
  padding:40px 24px;text-align:center;transition:border-color .15s,background .15s;
  cursor:pointer;
}
.dropzone.drag{border-color:var(--authority-soft);background:var(--authority-wash);}
.dropzone-icon{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--authority-soft);margin-bottom:10px;}
.dropzone-title{font-size:15.5px;font-weight:600;margin-bottom:5px;}
.dropzone-hint{font-size:13px;color:var(--ink-faint);}
input[type=file]{display:none;}
.upload-or{display:flex;align-items:center;gap:14px;margin:24px 0;color:var(--ink-faint);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono);}
.upload-or::before,.upload-or::after{content:"";flex:1;height:1px;background:var(--line);}
.paste-area{
  width:100%;min-height:160px;border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:16px;font-size:14px;line-height:1.6;color:var(--ink);background:var(--card);resize:vertical;
}
.paste-area:focus{border-color:var(--authority-soft);}
.upload-file-chip{
  display:flex;align-items:center;justify-content:space-between;background:var(--strong-wash);
  border:1px solid #CFE0D3;border-radius:var(--radius-sm);padding:12px 16px;margin-top:14px;font-size:13.5px;
}
.upload-file-chip button{background:none;border:none;color:var(--strong);font-weight:600;font-size:12.5px;}
.upload-footer{display:flex;justify-content:flex-end;margin-top:26px;}
.upload-error{background:var(--weak-wash);border:1px solid #E3BEBC;color:var(--weak);padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-top:14px;}

/* ---------- Extracting ---------- */
.extract-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;}
.extract-mark{font-family:var(--mono);font-size:12px;color:var(--authority-soft);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;}
.extract-title{font-family:var(--serif);font-size:24px;font-weight:500;margin:0 0 30px;}
.pulse-line{width:220px;height:2px;background:var(--line);border-radius:2px;overflow:hidden;position:relative;}
.pulse-line::after{
  content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;background:var(--authority);
  animation:pulseMove 1.1s ease-in-out infinite;
}
@keyframes pulseMove{0%{left:-40%;}100%{left:100%;}}
.extract-claims{margin-top:34px;display:flex;flex-direction:column;gap:8px;max-width:420px;width:100%;}
.extract-claim-row{
  font-size:13px;color:var(--ink-faint);font-family:var(--mono);opacity:0;
  animation:fadeUp .4s ease forwards;text-align:left;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Interview layout ---------- */
.interview-shell{flex:1;display:grid;grid-template-columns:280px 1fr;min-height:0;}
@media (max-width:860px){.interview-shell{grid-template-columns:1fr;}.ledger-panel{display:none;}.ledger-panel.mobile-open{display:block;position:fixed;inset:0;z-index:30;background:var(--paper);overflow:auto;padding:20px;}}
.ledger-panel{
  border-right:1px solid var(--line-soft);padding:22px 18px;overflow-y:auto;background:var(--paper-2);
}
.ledger-title{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);margin-bottom:14px;}
.ledger-item{
  padding:12px 12px;border-radius:var(--radius-sm);margin-bottom:6px;cursor:default;
  border:1px solid transparent;
}
.ledger-item.active{background:var(--card);border-color:var(--line);box-shadow:var(--shadow);}
.ledger-item-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;}
.exhibit-tag{font-family:var(--mono);font-size:10.5px;color:var(--authority-soft);letter-spacing:.03em;}
.ledger-item-text{font-size:12.5px;line-height:1.45;color:var(--ink);margin-bottom:8px;}
.meter{height:4px;background:var(--line-soft);border-radius:3px;overflow:hidden;}
.meter-fill{height:100%;border-radius:3px;transition:width .5s ease;}
.meter-fill.weak{background:var(--weak);}
.meter-fill.watch{background:var(--watch);}
.meter-fill.strong{background:var(--strong);}
.meter-fill.unclear{background:var(--ink-faint);}
.ledger-status{font-size:10.5px;margin-top:5px;color:var(--ink-faint);font-family:var(--mono);}

.chat-panel{display:flex;flex-direction:column;min-height:0;}
.chat-topbar{
  display:flex;align-items:center;justify-content:space-between;padding:14px 24px;
  border-bottom:1px solid var(--line-soft);
}
.progress-track{flex:1;height:3px;background:var(--line-soft);border-radius:2px;margin:0 20px;overflow:hidden;}
.progress-fill{height:100%;background:var(--authority);border-radius:2px;transition:width .4s ease;}
.progress-label{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);white-space:nowrap;}
.chat-scroll{flex:1;overflow-y:auto;padding:28px 24px 10px;}
.chat-inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px;}
.msg{display:flex;gap:12px;max-width:100%;}
.msg-avatar{
  width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;flex-shrink:0;margin-top:2px;color:#fff;
}
.msg.examiner .msg-avatar{background:var(--authority);}
.msg.user .msg-avatar{background:var(--ink-faint);}
.msg-body{flex:1;}
.msg-name{font-size:11.5px;font-weight:600;color:var(--ink-faint);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;font-family:var(--mono);}
.msg-text{font-size:15px;line-height:1.65;color:var(--ink);white-space:pre-wrap;}
.msg.system .msg-text{color:var(--ink-faint);font-style:italic;font-size:13.5px;}
.feedback-tag{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;
  padding:3px 9px;border-radius:999px;margin-bottom:8px;font-weight:500;
}
.feedback-tag.up{background:var(--strong-wash);color:var(--strong);}
.feedback-tag.down{background:var(--weak-wash);color:var(--weak);}
.feedback-tag.flat{background:var(--paper-2);color:var(--ink-faint);}
.typing{display:flex;gap:4px;padding:4px 0;}
.typing span{width:5px;height:5px;border-radius:50%;background:var(--ink-faint);animation:typingBounce 1.2s infinite ease-in-out;}
.typing span:nth-child(2){animation-delay:.15s;}
.typing span:nth-child(3){animation-delay:.3s;}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-4px);opacity:1;}}

.chat-input-bar{border-top:1px solid var(--line-soft);padding:16px 24px 20px;}
.chat-input-inner{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;}
.chat-textarea{
  flex:1;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;
  font-size:14.5px;line-height:1.5;resize:none;max-height:160px;background:var(--card);
}
.chat-textarea:focus{border-color:var(--authority-soft);}
.send-btn{
  background:var(--authority);color:#fff;border:none;border-radius:var(--radius-sm);
  width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .15s;
}
.send-btn:hover{background:#28394A;}
.send-btn:disabled{background:var(--line);cursor:not-allowed;}
.chat-hint{font-size:11.5px;color:var(--ink-faint);margin-top:8px;text-align:center;}

.error-banner{
  background:var(--weak-wash);border:1px solid #E3BEBC;color:var(--weak);padding:12px 16px;
  border-radius:var(--radius-sm);font-size:13.5px;margin:0 24px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.error-banner button{background:var(--weak);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;}

/* ---------- Report ---------- */
.report-wrap{flex:1;padding:48px 24px 80px;}
.report-inner{max-width:800px;margin:0 auto;}
.report-eyebrow{font-family:var(--mono);font-size:12px;color:var(--authority-soft);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;}
.report-title{font-family:var(--serif);font-size:32px;font-weight:500;letter-spacing:-0.015em;margin:0 0 10px;}
.report-sub{color:var(--ink-soft);font-size:15px;line-height:1.6;max-width:560px;margin-bottom:36px;}

.score-hero{
  background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:28px;display:flex;align-items:center;gap:28px;margin-bottom:36px;flex-wrap:wrap;
}
.score-ring{position:relative;width:96px;height:96px;flex-shrink:0;}
.score-ring svg{transform:rotate(-90deg);}
.score-ring-num{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:26px;font-weight:600;
}
.score-breakdown{flex:1;display:flex;gap:24px;flex-wrap:wrap;}
.score-stat{display:flex;flex-direction:column;gap:3px;}
.score-stat-num{font-family:var(--serif);font-size:22px;font-weight:600;}
.score-stat-label{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;font-family:var(--mono);}
.score-stat.strong .score-stat-num{color:var(--strong);}
.score-stat.watch .score-stat-num{color:var(--watch);}
.score-stat.weak .score-stat-num{color:var(--weak);}

.report-section-title{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);margin:36px 0 16px;}
.claim-card{
  background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:14px;
}
.claim-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:10px;}
.claim-card-text{font-size:15px;font-weight:500;line-height:1.5;flex:1;}
.verdict-badge{
  font-family:var(--mono);font-size:10.5px;padding:4px 10px;border-radius:999px;white-space:nowrap;font-weight:600;
}
.verdict-badge.strong{background:var(--strong-wash);color:var(--strong);}
.verdict-badge.watch{background:var(--watch-wash);color:var(--watch);}
.verdict-badge.weak{background:var(--weak-wash);color:var(--weak);}
.claim-card-meter{margin-bottom:12px;}
.claim-card-advice{font-size:13.5px;line-height:1.6;color:var(--ink-soft);}
.claim-card-advice b{color:var(--ink);font-weight:600;}

.report-summary-box{
  background:var(--authority-wash);border:1px solid #D3DEE5;border-radius:var(--radius);
  padding:22px 24px;margin:36px 0;font-size:14.5px;line-height:1.7;color:#2A3A47;
}
.report-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;}

/* ---------- Misc ---------- */
.skeleton{background:linear-gradient(90deg,var(--paper-2) 25%,var(--line-soft) 50%,var(--paper-2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.mobile-ledger-toggle{display:none;}
@media (max-width:860px){.mobile-ledger-toggle{display:inline-flex;}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ===================== STATE ===================== */
const DEFAULT_STATE = {
  screen:'intro',
  wizardStep:0,
  config:{ purpose:null, audience:null, toughness:null },
  resumeText:'',
  fileName:'',
  claims:[], // {id, text, category, confidence, status, exchanges:[], covered}
  transcript:[], // {role:'examiner'|'user'|'system', text, feedback?, claimId?}
  activeClaimId:null,
  finished:false,
  report:null,
  loadingMessage:null,
  errorMessage:null,
  mobileLedgerOpen:false
};
let state = JSON.parse(JSON.stringify(DEFAULT_STATE));

const LS_SESSIONS = 'dye_sessions_v1';

function loadSessions(){
  try{ return JSON.parse(localStorage.getItem(LS_SESSIONS) || '[]'); }catch(e){ return []; }
}
function saveSession(sessionObj){
  const all = loadSessions();
  const idx = all.findIndex(s=>s.id===sessionObj.id);
  if(idx>=0) all[idx]=sessionObj; else all.unshift(sessionObj);
  try{ localStorage.setItem(LS_SESSIONS, JSON.stringify(all.slice(0,25))); }catch(e){}
}
function currentSessionId(){
  if(!state._sessionId) state._sessionId = 'sess_'+Date.now();
  return state._sessionId;
}

/* ===================== CLAUDE API ===================== */
async function callClaude(systemPrompt, messages, maxTokens){
  maxTokens = maxTokens || 1000;
  const body = {
    model:"claude-sonnet-4-6",
    max_tokens:maxTokens,
    system:systemPrompt,
    messages:messages
  };
  let attempt=0;
  while(attempt<3){
    attempt++;
    try{
      const res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(body)
      });
      if(res.status===429 || res.status===529){
        await sleep(900*attempt);
        continue;
      }
      if(!res.ok){
        const txt = await res.text().catch(()=> '');
        throw new Error("API error "+res.status+" "+txt.slice(0,200));
      }
      const data = await res.json();
      const text = (data.content||[]).map(b=>b.text||'').join('\n').trim();
      return text;
    }catch(err){
      if(attempt>=3) throw err;
      await sleep(700*attempt);
    }
  }
  throw new Error("The examiner is temporarily unavailable.");
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function extractJSON(text){
  let t = text.trim();
  t = t.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'');
  const start = t.indexOf('{')===-1 ? t.indexOf('[') : (t.indexOf('[')===-1 ? t.indexOf('{') : Math.min(t.indexOf('{'),t.indexOf('[')===-1?Infinity:t.indexOf('[')));
  try{ return JSON.parse(t); }catch(e){}
  // fallback: find first { or [ and last matching close
  const firstObj = t.indexOf('{'); const firstArr = t.indexOf('[');
  let s = -1;
  if(firstObj===-1) s=firstArr; else if(firstArr===-1) s=firstObj; else s=Math.min(firstObj,firstArr);
  if(s===-1) throw new Error("No JSON found");
  const closeChar = t[s]==='{' ? '}' : ']';
  const e = t.lastIndexOf(closeChar);
  const slice = t.slice(s,e+1);
  return JSON.parse(slice);
}

function personaDescription(){
  const aud = {
    technical:"a technical/domain-expert interviewer who cares about *how* things actually work \u2014 implementation details, tradeoffs, edge cases, root causes, and why the candidate made the choices they made, not just outcomes.",
    behavioral:"a hiring-manager style behavioral interviewer who probes for real STAR substance \u2014 the specific situation, the candidate's individual action versus the team's, and concrete, measurable results.",
    executive:"a senior executive/panel interviewer who cares about judgment, strategic reasoning, prioritization, and leadership \u2014 pushing past the task itself to why it mattered and what it reveals about how the candidate thinks.",
    mixed:"a mixed panel interviewer who blends technical depth, behavioral rigor, and strategic/executive framing depending on what the claim calls for."
  };
  const tough = {
    supportive:"Your tone is warm and encouraging. Gently probe for specifics, affirm genuine strengths you hear, and always leave the candidate with a clear, answerable next question. Never be harsh, but never let vagueness slide unnoticed \u2014 name it kindly and ask for the concrete detail.",
    balanced:"Your tone is fair but firm, like a realistic interview. Push back on vague or unverifiable claims directly, but stay professional and give credit where it's earned.",
    hard:"Your tone is relentless and exacting, like a tough final-round interviewer. Interrupt vague or generic answers immediately, ask pointed follow-ups, and do not soften your skepticism. Still be professional, never rude."
  };
  return {audience:aud[state.config.audience]||aud.technical, toughness:tough[state.config.toughness]||tough.balanced};
}

/* ===================== EXTRACTION ===================== */
async function extractClaims(){
  const sys = `You are a meticulous interview-prep analyst. You read a person's resume or description of their work experience and extract every distinct, defensible CLAIM they are implicitly or explicitly making about themselves \u2014 achievements, metrics, technical skills, leadership moments, ownership statements, and collaboration claims. Extract 6 to 10 claims, prioritizing the ones most likely to be probed hard in a ${state.config.audience||'technical'} interview, and skip generic filler (e.g. "team player") unless it's the only substance available. Respond with ONLY valid JSON, no prose, no markdown fences, in this exact shape:
[{"id":"c1","text":"short paraphrase of the claim, in the person's voice, 8-18 words","category":"Achievement|Metric|Technical Skill|Leadership|Ownership|Collaboration","excerpt":"the closest original phrase from the source text, under 12 words"}]`;
  const msgs = [{role:"user",content:"Here is the candidate's resume / experience text:\n\n"+state.resumeText}];
  const raw = await callClaude(sys,msgs,1400);
  const arr = extractJSON(raw);
  return arr.map((c,i)=>({
    id:c.id||('c'+(i+1)),
    text:c.text,
    category:c.category||'Achievement',
    excerpt:c.excerpt||'',
    confidence:30,
    status:'unclear',
    exchanges:[],
    covered:false
  }));
}

/* ===================== INTERVIEW TURN ===================== */
async function nextExaminerTurn(){
  const persona = personaDescription();
  const claim = state.claims.find(c=>c.id===state.activeClaimId);
  const otherClaims = state.claims.filter(c=>c.id!==state.activeClaimId && !c.covered).map(c=>c.text);
  const historyForClaim = claim.exchanges.map(e=>`Q: ${e.q}\nA: ${e.a}`).join('\n\n');

  const sys = `You are conducting a live mock interview to help a candidate practice DEFENDING claims from their own resume before a real interview. You are ${persona.audience}
${persona.toughness}

Rules:
- Focus only on the CURRENT claim being examined unless it has been sufficiently defended.
- Ask exactly ONE question at a time. Never ask multiple questions in one turn.
- Base every question on what the candidate has actually said \u2014 make it feel personalized, never generic or templated.
- After 2-4 solid exchanges on a claim (or immediately if the candidate has clearly nailed it with specifics), decide to move on.
- If this is the very first question about this claim, ask an opening question that invites them to prove the claim with specifics (numbers, decisions, mechanics).
- Respond with ONLY valid JSON, no prose outside the JSON, in this exact shape:
{"feedback":"1 short sentence (max 20 words) reacting honestly to their last answer, or empty string if this is the opening question for this claim","confidenceDelta":-15 to 20 (integer, how much this answer moves confidence in this specific claim; 0 if opening question),"moveToNext":true or false (true if you're satisfied enough with this claim's defense to move to the next one, or if candidate has hit a wall and further probing won't help),"question":"the single next thing to say to the candidate \u2014 either a probing follow-up on this claim, or if moveToNext is true, a brief natural transition plus the opening question for the NEXT claim topic (pick something sensible from: ${otherClaims.join(' | ')||'none left \u2014 in that case set moveToNext false and ask one final hard question on this claim'})"}`;

  const conversation = `CLAIM UNDER EXAMINATION: "${claim.text}" (category: ${claim.category})\nOriginal resume phrase: "${claim.excerpt}"\n\nExchange so far on this claim:\n${historyForClaim || '(none yet \u2014 this is the opening question)'}\n\n${claim.exchanges.length ? 'Candidate\'s latest answer: '+claim.exchanges[claim.exchanges.length-1].a : ''}`;

  const msgs = [{role:"user",content:conversation}];
  const raw = await callClaude(sys,msgs,500);
  return extractJSON(raw);
}

/* ===================== REPORT GENERATION ===================== */
async function generateReport(){
  const sys = `You are an expert interview coach writing a final "Defense Report" after a mock cross-examination of a candidate's resume claims. For each claim, you're given its current confidence score (0-100) and the Q&A exchanges. Classify each claim's verdict as "strong" (well-defended, score>=70), "watch" (needs improvement, 40-69), or "weak" (score<40). Write specific, actionable advice per claim referencing what actually happened in the exchange \u2014 never generic tips. Also write a 2-3 sentence overall summary of the candidate's readiness, direct and honest but encouraging.
Respond with ONLY valid JSON in this exact shape:
{"overallSummary":"2-3 sentences","claims":[{"id":"c1","verdict":"strong|watch|weak","advice":"1-2 sentences of specific, actionable advice referencing their actual answers"}]}`;

  const payload = state.claims.map(c=>({id:c.id,text:c.text,confidence:c.confidence,exchanges:c.exchanges})); 
  const msgs = [{role:"user",content:JSON.stringify(payload)}];
  const raw = await callClaude(sys,msgs,1800);
  return extractJSON(raw);
}

function statusFromScore(n){ if(n>=70) return 'strong'; if(n>=40) return 'watch'; if(n<=15) return 'unclear'; return 'weak'; }

  const dz = wrap.querySelector('#dropzone');
  const fileInput = wrap.querySelector('#fileInput');
  const pasteArea = wrap.querySelector('#pasteArea');

  function showChip(name){
    chipSlot.innerHTML='';

    chipSlot.querySelector('#chipClear').addEventListener('click',()=>{ state.fileName=''; state.resumeText=''; pasteArea.value=''; chipSlot.innerHTML=''; });
  }
  function handleFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e)=>{ state.resumeText = e.target.result; state.fileName = file.name; pasteArea.value = state.resumeText; showChip(file.name); };
    reader.readAsText(file);
  }
  dz.addEventListener('click',()=>fileInput.click());
  fileInput.addEventListener('change',(e)=>handleFile(e.target.files[0]));
  ['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,(e)=>{e.preventDefault();dz.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,(e)=>{e.preventDefault();dz.classList.remove('drag');}));

    }
  });
  return wrap;
}

function exhibitLabel(idx){
  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  return 'Exhibit '+(idx<26?letters[idx]:('A'+(idx-25)));
}
function renderLedger(){
  const items = state.claims.map((c,i)=>{

    return `<div class="ledger-item ${c.id===state.activeClaimId?'active':''}">
      <div class="ledger-item-top"><span class="exhibit-tag">${exhibitLabel(i)}</span><span style="font-size:10.5px;color:var(--ink-faint);font-family:var(--mono);">${c.confidence}%</span></div>

function statusWord(s){ return s==='strong'?'well defended':(s==='watch'?'needs work':'weak'); }

  const wrap = el(`<div class="screen">

      <div class="topbar-actions">

  </div>`);

  wrap.querySelector('.ledger-panel-slot').outerHTML = renderLedger();

  });

  }

  if(finishBtn) finishBtn.addEventListener('click', finishInterview);

  const input = wrap.querySelector('#chatInput');

    const val = input.value.trim();
    if(!val || state.finished) return;
    submitAnswer(val);
    input.value='';
  }
  if(input){
    input.addEventListener('keydown',(e)=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSend(); }
    });

function renderMsg(m){
  if(m.role==='system'){
    return el(`<div class="msg system"><div class="msg-body"><div class="msg-text">${esc(m.text)}</div></div></div>`);
  }
  if(m.role==='examiner'){
    const fb = m.feedback ? `<span class="feedback-tag ${m.feedbackTone||'flat'}">${esc(m.feedback)}</span><br>` : '';
    return el(`<div class="msg examiner"><div class="msg-avatar">EX</div><div class="msg-body"><div class="msg-name">Examiner</div><div class="msg-text">${fb}${esc(m.text)}</div></div></div>`);
  }
  return el(`<div class="msg user"><div class="msg-avatar">YOU</div><div class="msg-body"><div class="msg-name">You</div><div class="msg-text">${esc(m.text)}</div></div></div>`);
}

async function askExaminer(){
  state._pendingTyping = true;
  renderPatch();
  try{
    const turn = await nextExaminerTurn();
    state._pendingTyping = false;
    const claim = state.claims.find(c=>c.id===state.activeClaimId);
    if(turn.feedback){
      const lastMsg = {role:'examiner', text:turn.question, feedback:turn.feedback, feedbackTone: turn.confidenceDelta>3?'up':(turn.confidenceDelta<-3?'down':'flat')};
      state.transcript.push(lastMsg);
    } else {
      state.transcript.push({role:'examiner', text:turn.question});
    }
    if(typeof turn.confidenceDelta==='number' && claim.exchanges.length>0){
      claim.confidence = Math.max(5,Math.min(98, claim.confidence + turn.confidenceDelta));
      claim.status = statusFromScore(claim.confidence);
    }
    if(turn.moveToNext){
      claim.covered = true;
      claim.status = statusFromScore(claim.confidence);
      const next = state.claims.find(c=>!c.covered);
      if(next){
        state.activeClaimId = next.id;
      } else {
        finishInterview();
        return;
      }
    }
    render();
  }catch(err){
    state._pendingTyping = false;
    state._error = "The examiner hit a snag (possibly a rate limit). Take a breath and retry.";
    render();
  }
}

function renderPatch(){ render(); }

function submitAnswer(text){
  state.transcript.push({role:'user', text});
  const claim = state.claims.find(c=>c.id===state.activeClaimId);
  const lastQ = [...state.transcript].reverse().find(m=>m.role==='examiner');
  claim.exchanges.push({q: lastQ?lastQ.text:'', a:text});
  render();
  askExaminer();
}

async function finishInterview(){
  state.finished = true;
  state.claims.forEach(c=>{ if(!c.covered){ c.covered=true; c.status = statusFromScore(c.confidence); } });
  state.transcript.push({role:'system', text:'Examination complete. Compiling your Defense Report...'});
  render();
  try{
    const report = await generateReport();
    state.report = report;
    persistSession();
    state.screen='report';
    render();
  }catch(err){
    state._error = "Couldn't generate the report (temporary issue). Retry below.";
    render();
    const btn = document.getElementById('retryBtn');
  }
}
function persistSession(){
  const scores = state.claims.map(c=>c.confidence);
  const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  saveSession({
    id: currentSessionId(),
    createdAt: Date.now(),
    fileName: state.fileName || 'Pasted experience',
    config: state.config,
    claims: state.claims,
    report: state.report,
    avgScore: avg
  });
}

/* ---------- Report ---------- */
function renderReport(){
  const scores = state.claims.map(c=>c.confidence);
  const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  const strongCt = state.claims.filter(c=>c.status==='strong').length;
  const watchCt = state.claims.filter(c=>c.status==='watch').length;
  const weakCt = state.claims.filter(c=>c.status==='weak' || c.status==='unclear').length;
  const circumference = 2*Math.PI*40;
  const dash = (avg/100)*circumference;

  const wrap = el(`<div class="screen">
    <div class="topbar">
      <div class="brand"><div class="brand-mark">DY</div><div class="brand-name">Defend Your Experience</div></div>
      <div class="topbar-actions">
        <button class="pill-btn" id="btnExport">Export report</button>
        <button class="pill-btn" id="btnNew">New session</button>
      </div>
    </div>
    <div class="report-wrap">
      <div class="report-inner">
        <div class="report-eyebrow">Defense Report</div>
        <div class="report-title">Here's where you actually stand</div>
        <div class="report-sub">${esc((state.report&&state.report.overallSummary) || 'Your examination is complete.')}</div>

        <div class="score-hero">
          <div class="score-ring">
            <svg width="96" height="96" viewBox="0 0 96 96">
              <circle cx="48" cy="48" r="40" fill="none" stroke="var(--line-soft)" stroke-width="8"/>
              <circle cx="48" cy="48" r="40" fill="none" stroke="${avg>=70?'var(--strong)':avg>=40?'var(--watch)':'var(--weak)'}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${dash} ${circumference}"/>
            </svg>
            <div class="score-ring-num">${avg}</div>
          </div>
          <div class="score-breakdown">
            <div class="score-stat strong"><div class="score-stat-num">${strongCt}</div><div class="score-stat-label">Well defended</div></div>
            <div class="score-stat watch"><div class="score-stat-num">${watchCt}</div><div class="score-stat-label">Needs work</div></div>
            <div class="score-stat weak"><div class="score-stat-num">${weakCt}</div><div class="score-stat-label">Weak</div></div>
          </div>
        </div>

        <div class="report-section-title">Exhibit-by-exhibit verdict</div>
        <div id="claimsList"></div>

        <div class="report-actions">
          <button class="btn-secondary" id="btnRematch">Re-examine weak exhibits</button>
          <button class="btn-primary" id="btnNew2">Start a new session</button>
        </div>
      </div>
    </div>
  </div>`);

  const list = wrap.querySelector('#claimsList');
  state.claims.forEach((c,i)=>{
    const rc = (state.report && state.report.claims && state.report.claims.find(r=>r.id===c.id)) || {};
    const verdict = rc.verdict || c.status;
    const advice = rc.advice || 'No specific notes captured for this exhibit.';
    list.appendChild(el(`<div class="claim-card">
      <div class="claim-card-top">
        <div class="claim-card-text"><span class="exhibit-tag">${exhibitLabel(i)}</span><br>${esc(c.text)}</div>
        <div class="verdict-badge ${verdict==='strong'?'strong':(verdict==='watch'?'watch':'weak')}">${verdict==='strong'?'Well defended':verdict==='watch'?'Needs work':'Weak'}</div>
      </div>
      <div class="claim-card-meter"><div class="meter"><div class="meter-fill ${verdict}" style="width:${c.confidence}%"></div></div></div>
      <div class="claim-card-advice"><b>Coach's note:</b> ${esc(advice)}</div>
    </div>`));
  });

  function startNew(){
    const keepConfig = state.config;
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    state.config = keepConfig;
    state.screen='upload';
    render();
  }
  wrap.querySelector('#btnNew').addEventListener('click', startNew);
  wrap.querySelector('#btnNew2').addEventListener('click', startNew);
  wrap.querySelector('#btnRematch').addEventListener('click', ()=>{
    const weakClaims = state.claims.filter(c=>c.status!=='strong');
    if(!weakClaims.length){ return; }
    weakClaims.forEach(c=>{ c.covered=false; });
    state.claims.forEach(c=>{ if(c.status==='strong') c.covered=true; });
    state.activeClaimId = weakClaims[0].id;
    state.finished = false;
    state.transcript.push({role:'system', text:'Re-opening weaker exhibits for another round.'});
    state.screen='interview';
    render();
    askExaminer();
  });
  wrap.querySelector('#btnExport').addEventListener('click', exportReport);
  return wrap;
}

function exportReport(){
  const lines = [];
  lines.push('DEFENSE REPORT');
  lines.push('Generated: '+new Date().toLocaleString());
  lines.push('');
  lines.push('SUMMARY: '+((state.report&&state.report.overallSummary)||''));
  lines.push('');
  state.claims.forEach((c,i)=>{
    const rc = (state.report && state.report.claims && state.report.claims.find(r=>r.id===c.id)) || {};
    lines.push(exhibitLabel(i)+': '+c.text);
    lines.push('  Confidence: '+c.confidence+'% ('+(rc.verdict||c.status)+')');
    lines.push('  Advice: '+(rc.advice||''));
    c.exchanges.forEach(e=>{ lines.push('  Q: '+e.q); lines.push('  A: '+e.a); });
    lines.push('');
  });
  const blob = new Blob([lines.join('\n')], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'defense-report.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ===================== INIT ===================== */
render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Compass — Healthcare</title>
<style>
  :root{
    --bg-0:#070c14;
    --bg-1:#0c1622;
    --glass:rgba(255,255,255,0.045);
    --glass-brd:rgba(255,255,255,0.09);
    --teal:#2dd4bf;
    --teal-dim:#164e47;
    --coral:#fb7185;
    --text-hi:#eef4f7;
    --text-lo:#8ea3ad;
    --nurse:#38bdf8;
    --physician:#2dd4bf;
    --pharmacist:#a78bfa;
    --lab:#fbbf24;
    --coordinator:#f472b6;
    --admin:#94a3b8;
    --it:#22d3ee;
    --frontdesk:#4ade80;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 700px at 15% -10%, #0d2230 0%, transparent 60%),
      radial-gradient(1000px 600px at 110% 10%, #14202f 0%, transparent 55%),
      var(--bg-0);
    color:var(--text-hi);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;}

  /* ---------- Header / ECG ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(7,12,20,0.72);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--glass-brd);
    padding:14px 20px 10px;
  }
  .hdr-row{display:flex;align-items:center;justify-content:space-between;max-width:960px;margin:0 auto;flex-wrap:wrap;gap:8px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;flex-shrink:0;}
  .brand h1{font-size:19px;margin:0;letter-spacing:0.2px;font-weight:700;}
  .brand p{margin:1px 0 0;font-size:12px;color:var(--text-lo);}
  .sound-toggle{
    background:var(--glass);border:1px solid var(--glass-brd);color:var(--text-lo);
    border-radius:10px;padding:6px 10px;font-size:12px;cursor:pointer;
  }
  .ecg-wrap{max-width:960px;margin:10px auto 0;height:30px;position:relative;overflow:hidden;border-radius:8px;}
  .ecg-wrap svg{width:200%;height:100%;animation:scroll-ecg 5.5s linear infinite;}
  @keyframes scroll-ecg{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .progress-row{max-width:960px;margin:10px auto 0;display:flex;gap:5px;}
  .progress-seg{flex:1;height:5px;border-radius:4px;background:rgba(255,255,255,0.08);overflow:hidden;}
  .progress-seg i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--teal),#5eead4);transition:width .5s ease;}
  .progress-label{max-width:960px;margin:6px auto 0;font-size:12px;color:var(--text-lo);display:flex;justify-content:space-between;}

  main{max-width:960px;margin:0 auto;padding:22px 18px 70px;}

  /* ---------- Cards / glass ---------- */
  .glass{
    background:var(--glass);
    border:1px solid var(--glass-brd);
    border-radius:var(--radius);
    backdrop-filter:blur(10px);
  }
  .fade-in{animation:fadeIn .45s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Intro screen ---------- */
  .intro{padding:34px 28px;text-align:center;}
  .intro .stage-tag{
    display:inline-block;font-size:12px;letter-spacing:1.5px;color:var(--teal);
    background:var(--teal-dim);padding:4px 12px;border-radius:20px;margin-bottom:14px;
  }
  .intro h2{font-size:26px;margin:0 0 10px;}
  .intro p{color:var(--text-lo);font-size:15px;max-width:560px;margin:0 auto 22px;line-height:1.55;}
  .btn{
    background:linear-gradient(135deg,var(--teal),#22a99a);
    color:#04211d;border:none;font-weight:700;font-size:14.5px;
    padding:12px 26px;border-radius:12px;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 8px 20px rgba(45,212,191,0.18);
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(45,212,191,0.28);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn.ghost{background:transparent;border:1px solid var(--glass-brd);color:var(--text-hi);box-shadow:none;}

  /* ---------- Ticket / task card ---------- */
  .ticket{
    position:relative;padding:20px 22px;margin-bottom:20px;border-left:4px solid var(--teal);
  }
  .ticket .tid{font-size:11px;color:var(--text-lo);letter-spacing:1px;margin-bottom:6px;display:flex;gap:8px;align-items:center;}
  .ticket .tid .dot{width:6px;height:6px;border-radius:50%;background:var(--coral);}
  .ticket h3{margin:0 0 8px;font-size:18px;line-height:1.35;}
  .ticket .desc{color:var(--text-lo);font-size:14.5px;line-height:1.5;}

  /* ---------- Role pool / cards ---------- */
  .pool-label{font-size:12px;color:var(--text-lo);letter-spacing:1px;text-transform:uppercase;margin:22px 0 10px;}
  .role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .role-card{
    --rc: var(--admin);
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.09);
    border-left:3px solid var(--rc);
    border-radius:14px;padding:12px 12px;cursor:grab;
    display:flex;align-items:center;gap:10px;user-select:none;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .role-card:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(0,0,0,0.35);}
  .role-card.dragging{opacity:0.35;}
  .role-card.selected{box-shadow:0 0 0 2px var(--rc) inset;background:rgba(255,255,255,0.08);}
  .role-card .emoji{font-size:20px;}
  .role-card .rname{font-size:13.5px;font-weight:600;}
  .role-card .star{margin-left:auto;font-size:14px;opacity:0.4;cursor:pointer;}
  .role-card .star.active{opacity:1;color:#ffd166;}

  /* ---------- Ownership slot ---------- */
  .slot-zone{margin-top:8px;}
  .slot{
    min-height:70px;border:2px dashed rgba(255,255,255,0.16);border-radius:16px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    color:var(--text-lo);font-size:13.5px;transition:border-color .2s ease, background .2s ease, transform .15s ease;
  }
  .slot.over{border-color:var(--teal);background:rgba(45,212,191,0.07);}
  .slot.filled{border-style:solid;border-color:var(--rc,var(--teal));background:rgba(255,255,255,0.05);color:var(--text-hi);}
  .slot.snap{animation:snap .28s ease;}
  @keyframes snap{0%{transform:scale(1.04);}100%{transform:scale(1);}}
  .slot .clear{margin-left:8px;font-size:11px;color:var(--text-lo);cursor:pointer;text-decoration:underline;}

  /* ---------- Sequence slots (stage 2) ---------- */
  .seq-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .seq-slot{
    flex:1;min-width:110px;min-height:64px;border:2px dashed rgba(255,255,255,0.16);border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:12.5px;color:var(--text-lo);position:relative;transition:border-color .2s ease, background .2s ease;
  }
  .seq-slot .idx{position:absolute;top:5px;left:8px;font-size:10px;color:var(--text-lo);}
  .seq-slot.filled{border-style:solid;background:rgba(255,255,255,0.05);color:var(--text-hi);border-color:var(--rc,var(--teal));}
  .seq-slot.over{border-color:var(--teal);}
  .seq-arrow{color:var(--text-lo);font-size:16px;}
  .seq-slot .clear{font-size:10px;text-decoration:underline;cursor:pointer;color:var(--text-lo);margin-top:2px;}

  /* ---------- Reveal panel ---------- */
  .reveal{padding:22px;margin-top:18px;border-left:4px solid var(--teal);}
  .reveal h4{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px;}
  .reveal .tag-owner{color:var(--teal);}
  .reveal p{margin:4px 0 14px;color:var(--text-lo);font-size:14px;line-height:1.55;}
  .pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .pill{
    font-size:12.5px;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,0.06);
    border:1px solid var(--glass-brd);display:flex;align-items:center;gap:6px;
  }
  .pill.correct{border-color:var(--teal);color:var(--teal);}
  .pill.wrong{border-color:var(--coral);color:var(--coral);}
  .flow-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13.5px;color:var(--text-hi);}
  .flow-line span.arrow{color:var(--text-lo);}

  /* ---------- footer bar ---------- */
  .action-bar{display:flex;justify-content:space-between;align-items:center;margin-top:24px;flex-wrap:wrap;gap:10px;}
  .hint{font-size:12.5px;color:var(--text-lo);}

  /* ---------- Dashboard ---------- */
  .dash-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;}
  @media (max-width:720px){.dash-grid{grid-template-columns:1fr;}}
  .radar-card, .reflect-card{padding:22px;}
  .cat-row{display:flex;justify-content:space-between;font-size:13px;margin:10px 0 4px;color:var(--text-lo);}
  .cat-bar{height:8px;border-radius:6px;background:rgba(255,255,255,0.07);overflow:hidden;margin-bottom:12px;}
  .cat-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),#5eead4);width:0%;transition:width 1s ease;}
  .reflect-card h4{margin:0 0 4px;font-size:13.5px;color:var(--teal);letter-spacing:0.5px;text-transform:uppercase;}
  .reflect-card p{margin:0 0 16px;font-size:14px;color:var(--text-hi);line-height:1.6;}
  .confetti-wrap{position:relative;height:0;}
  .confetti{position:absolute;top:0;font-size:20px;opacity:0;animation:pop 1.4s ease forwards;}
  @keyframes pop{0%{opacity:0;transform:translateY(0) rotate(0);}15%{opacity:1;}100%{opacity:0;transform:translateY(160px) rotate(200deg);}}

  ::selection{background:var(--teal);color:#04211d;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important; transition-duration:.001s !important;}
  }
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.5"/><path d="M6 17h5l2-7 4 14 3-9 2 5h6" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><h1>Task Compass</h1><p>Learn how work flows through real organizations.</p></div>
    </div>
    <button class="sound-toggle" id="soundBtn">🔊 Sound on</button>
  </div>
  <div class="ecg-wrap">
    <svg viewBox="0 0 600 30" preserveAspectRatio="none">
      <polyline fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.55"
        points="0,15 40,15 55,15 62,4 68,26 74,15 90,15 130,15 145,15 152,4 158,26 164,15 180,15
                220,15 235,15 242,4 248,26 254,15 270,15 310,15 325,15 332,4 338,26 344,15 360,15
                400,15 415,15 422,4 428,26 434,15 450,15 490,15 505,15 512,4 518,26 524,15 540,15
                580,15 595,15 602,4 608,26 614,15 630,15"/>
    </svg>
  </div>
  <div class="progress-row" id="progressRow"></div>
  <div class="progress-label"><span id="progLeft">Stage 1 · Who Owns This?</span><span id="progRight">Question 1 of 3</span></div>
</header>

<main id="app"></main>

<script>
(function(){
  "use strict";

  /* ============ DATA ============ */
  const ROLES = [
    {id:"nurse",       name:"Nurse (RN)",              emoji:"🩺", color:"var(--nurse)"},
    {id:"physician",   name:"Physician",                emoji:"👨‍⚕️", color:"var(--physician)"},
    {id:"pharmacist",  name:"Pharmacist",                emoji:"💊", color:"var(--pharmacist)"},
    {id:"lab",         name:"Lab Technician",           emoji:"🧪", color:"var(--lab)"},
    {id:"coordinator", name:"Care Coordinator",         emoji:"📋", color:"var(--coordinator)"},
    {id:"admin",       name:"Hospital Administrator",   emoji:"🏥", color:"var(--admin)"},
    {id:"it",          name:"Health IT / Informatics",  emoji:"💻", color:"var(--it)"},
    {id:"frontdesk",   name:"Patient Access / Front Desk", emoji:"🗂️", color:"var(--frontdesk)"}
  ];
  const R = Object.fromEntries(ROLES.map(r=>[r.id,r]));

  const STAGE1_POOL = [
    {id:"t1", title:"A patient's medication dose in the system doesn't match what the physician prescribed.",
      owner:"pharmacist", assist:["physician","nurse","it"],
      why:"Pharmacists are the safety checkpoint for medication accuracy — they verify every order against what was prescribed before anything is dispensed."},
    {id:"t2", title:"A patient says they were discharged without receiving their paperwork.",
      owner:"nurse", assist:["coordinator","frontdesk","physician"],
      why:"The bedside nurse manages the discharge process, so missing paperwork is first their responsibility to catch and correct."},
    {id:"t3", title:"Lab results for urgent cases are coming back three days late.",
      owner:"lab", assist:["physician","it","nurse"],
      why:"The lab technician runs and reports the tests, so a processing delay starts as their operational issue to investigate."},
    {id:"t4", title:"Patients are complaining about long wait times at check-in.",
      owner:"frontdesk", assist:["coordinator","admin","nurse"],
      why:"Front desk / patient access owns the check-in experience — they control scheduling flow and see the bottleneck directly."},
    {id:"t5", title:"A patient's insurance information was entered incorrectly, delaying their visit.",
      owner:"frontdesk", assist:["it","coordinator","admin"],
      why:"Patient information is captured at intake, so front desk owns correcting the record where the error originated."},
    {id:"t6", title:"A patient's insurance claim was denied and they need it resolved.",
      owner:"coordinator", assist:["frontdesk","admin","physician"],
      why:"Care coordinators manage the ongoing relationship with insurers and patients, making them the natural owner of a claim dispute."},
    {id:"t7", title:"The nurse call-button system is malfunctioning on an entire ward.",
      owner:"it", assist:["admin","nurse"],
      why:"This is a technology and infrastructure failure, so health IT owns diagnosing and restoring the system."},
    {id:"t8", title:"A physician's order isn't showing up in the electronic health record.",
      owner:"it", assist:["physician","nurse","pharmacist"],
      why:"A missing order is a system/data issue, placing it with health IT even though physicians and nurses are directly affected."},
    {id:"t9", title:"A prescribed medication is out of stock at the pharmacy.",
      owner:"pharmacist", assist:["physician","admin","nurse"],
      why:"Inventory and substitution decisions for medications sit with the pharmacist, who can also flag supply issues upward."}
  ];

  const STAGE2_POOL = [
    {id:"w1", title:"A new prescription needs to be filled and safely reach the patient.",
      order:["physician","it","pharmacist","nurse"],
      why:"The physician places the order, it's logged and verified in the system, the pharmacist checks and dispenses it, and the nurse administers it at the bedside."},
    {id:"w2", title:"A patient needs to be discharged after treatment.",
      order:["physician","nurse","coordinator"],
      why:"The physician clears the patient medically, the nurse prepares care instructions, and the coordinator arranges any follow-up before the patient leaves."},
    {id:"w3", title:"A patient calls with a question about their upcoming appointment.",
      order:["frontdesk","coordinator"],
      why:"Front desk takes the call and confirms the details, escalating to the coordinator only if scheduling changes are needed."},
    {id:"w4", title:"Lab results come back abnormal and require follow-up care.",
      order:["lab","physician","nurse"],
      why:"The lab reports the finding, the physician interprets it and decides on treatment, and the nurse carries out and communicates the care plan."},
    {id:"w5", title:"A billing dispute needs to be fully resolved for a patient.",
      order:["frontdesk","coordinator","admin"],
      why:"Front desk logs the complaint, the coordinator investigates the claim details, and the administrator authorizes the final resolution."},
    {id:"w6", title:"A system outage is blocking nurses from viewing patient charts.",
      order:["it","nurse","physician"],
      why:"IT restores access first, then the nurse resumes charting and care, and the physician reviews anything that may have been missed."}
  ];

  const STAGE3_POOL = [
    {id:"c1", title:"Patient satisfaction scores drop sharply hospital-wide this quarter.",
      primary:"admin", support:["nurse","physician","coordinator","frontdesk"],
      why:"Satisfaction reflects the whole patient journey, so leadership coordinates a response while care and service teams surface what's actually happening on the ground.",
      flow:"Front Desk & Coordinator report patterns → Nursing & Physician leads weigh in on care quality → Administrator sets the action plan → communicated back to all teams."},
    {id:"c2", title:"A new infectious outbreak requires a rapid facility-wide response.",
      primary:"physician", support:["nurse","admin","lab","it"],
      why:"Clinical leadership sets treatment and isolation protocol, nursing implements it at the bedside, the lab tracks testing, IT updates reporting systems, and administration secures resources.",
      flow:"Physician sets protocol → Nurse implements precautions → Lab tracks results → IT updates tracking systems → Administrator allocates resources."},
    {id:"c3", title:"Negative online reviews mention long waits and unfriendly service.",
      primary:"admin", support:["frontdesk","nurse","coordinator"],
      why:"This spans operations and interpersonal service, so administration leads the response while frontline teams address the root causes reviewers are naming.",
      flow:"Administrator reviews feedback trends → Front Desk & Coordinator address service touchpoints → Nurse improves bedside experience → results monitored over time."},
    {id:"c4", title:"A major equipment failure delays several scheduled surgeries.",
      primary:"admin", support:["it","physician","nurse"],
      why:"Equipment and logistics fall under administrative operations, while IT restores systems and clinical staff manage the impact on patient care and communication.",
      flow:"Administrator coordinates equipment repair/replacement → IT restores connected systems → Physician & Nurse manage patient care and communication."},
    {id:"c5", title:"Patient safety incident reports are rising across several units.",
      primary:"admin", support:["nurse","physician","pharmacist"],
      why:"Rising incidents need administrative oversight to coordinate a root-cause review, with frontline clinical staff providing the on-the-ground insight.",
      flow:"Nurse & Physician flag incident details → Pharmacist reviews medication-related factors → Administrator leads root-cause review and policy changes."},
    {id:"c6", title:"Pharmacy shortages are causing prescription delays hospital-wide.",
      primary:"pharmacist", support:["admin","physician","it"],
      why:"The pharmacist manages inventory day-to-day, administration secures supply chain solutions, physicians adapt prescribing, and IT tracks stock accuracy.",
      flow:"Pharmacist flags shortages → Administrator engages suppliers → Physician adjusts prescribing where possible → IT keeps stock records current."}
  ];

  /* ============ STATE ============ */
  let state = {
    stage:1, qIndex:0, phase:"intro",
    picks:{1:[],2:[],3:[]},
    results:{1:[],2:[],3:[]},
    selection:null,       // stage1: role id
    seq:[],               // stage2: array of role ids (nulls for empty)
    chosen:[],            // stage3: array of role ids selected
    primary:null,          // stage3: role id marked primary
    soundOn:true
  };

  function shuffle(arr){
    const a=arr.slice();
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    return a;
  }
  function pick3(pool){ return shuffle(pool).slice(0,3); }

  function newGame(){
    state.picks[1]=pick3(STAGE1_POOL);
    state.picks[2]=pick3(STAGE2_POOL);
    state.picks[3]=pick3(STAGE3_POOL);
    state.results={1:[],2:[],3:[]};
    state.stage=1; state.qIndex=0; state.phase="intro";
    resetInputs();
    render();
  }
  function resetInputs(){
    state.selection=null;
    const task = currentTask();
    state.seq = task && task.order ? new Array(task.order.length).fill(null) : [];
    state.chosen=[]; state.primary=null;
  }
  function currentTask(){
    const list = state.picks[state.stage];
    return list ? list[state.qIndex] : null;
  }

  /* ============ SOUND ============ */
  let actx;
  function beep(freq, dur){
    if(!state.soundOn) return;
    try{
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      const o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=freq;
      g.gain.setValueAtTime(0.06, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime+dur);
    }catch(e){}
  }

  /* ============ PROGRESS BAR ============ */
  const STAGE_NAMES = {1:"Who Owns This?", 2:"Task Routing", 3:"Collaboration Challenge"};
  function renderProgress(){
    const row = document.getElementById("progressRow");
    row.innerHTML="";
    for(let s=1;s<=3;s++){
      for(let q=0;q<3;q++){
        const seg=document.createElement("div");
        seg.className="progress-seg";
        const i=document.createElement("i");
        const doneCount = state.results[s].length;
        const isCurrent = (s===state.stage && q===state.qIndex && state.phase!=="dashboard");
        let width="0%";
        if(s<state.stage || (s===state.stage && q<doneCount)) width="100%";
        else if(isCurrent) width="35%";
        i.style.width=width;
        seg.appendChild(i);
        row.appendChild(seg);
      }
    }
    document.getElementById("progLeft").textContent =
      state.phase==="dashboard" ? "Complete" : `Stage ${state.stage} · ${STAGE_NAMES[state.stage]}`;
    document.getElementById("progRight").textContent =
      state.phase==="dashboard" ? "Organizational Thinking Dashboard" : `Question ${state.qIndex+1} of 3`;
  }

  /* ============ RENDER ROUTER ============ */
  function render(){
    renderProgress();
    const app=document.getElementById("app");
    app.innerHTML="";
    if(state.phase==="intro") app.appendChild(renderIntro());
    else if(state.phase==="question") app.appendChild(renderQuestion());
    else if(state.phase==="reveal") app.appendChild(renderReveal());
    else if(state.phase==="dashboard") app.appendChild(renderDashboard());
  }

  const STAGE_COPY = {
    1:{tag:"STAGE 1", h:"Who Owns This?",
       p:"A situation lands on your desk. Drag the one role who should primarily own it into the slot below. There's no single 'job title' quiz here — think about who is actually accountable when this happens."},
    2:{tag:"STAGE 2", h:"Task Routing",
       p:"Now you're managing incoming work. Build the path a task should travel through the organization, in order — from first responder to the person who closes the loop."},
    3:{tag:"STAGE 3", h:"Collaboration Challenge",
       p:"Bigger situations rarely have one owner. Select up to four roles who should be involved, then mark which one leads. Most real problems are solved by teams, not individuals."}
  };

  function renderIntro(){
    const c=STAGE_COPY[state.stage];
    const div=document.createElement("div");
    div.className="glass intro fade-in";
    div.innerHTML = `
      <div class="stage-tag">${c.tag}</div>
      <h2>${c.h}</h2>
      <p>${c.p}</p>
      <button class="btn" id="startBtn">Begin</button>
    `;
    div.querySelector("#startBtn").onclick=()=>{
      state.phase="question"; resetInputs(); render();
    };
    return div;
  }

  /* ============ ROLE CARD FACTORY ============ */
  function makeRoleCard(role, opts){
    opts=opts||{};
    const card=document.createElement("div");
    card.className="role-card";
    card.style.setProperty("--rc", role.color);
    card.draggable = !!opts.draggable;
    card.dataset.role = role.id;
    card.innerHTML = `<span class="emoji">${role.emoji}</span><span class="rname">${role.name}</span>${opts.star? '<span class="star">★</span>':''}`;
    if(opts.draggable){
      card.addEventListener("dragstart", e=>{
        e.dataTransfer.setData("text/plain", role.id);
        card.classList.add("dragging");
      });
      card.addEventListener("dragend", ()=>card.classList.remove("dragging"));
    }
    if(opts.onClick) card.addEventListener("click", (e)=>opts.onClick(role.id, e, card));
    if(opts.selected) card.classList.add("selected");
    if(opts.starActive) card.querySelector(".star").classList.add("active");
    return card;
  }

  /* ============ STAGE QUESTION RENDER ============ */
  function renderQuestion(){
    const wrap=document.createElement("div");
    const task=currentTask();

    const ticket=document.createElement("div");
    ticket.className="glass ticket fade-in";
    ticket.innerHTML = `<div class="tid"><span class="dot"></span> TICKET #TCK-${(100+ (state.stage*10) + state.qIndex)} · ${STAGE_COPY[state.stage].h.toUpperCase()}</div>
      <h3>${task.title}</h3>`;
    wrap.appendChild(ticket);

    if(state.stage===1) wrap.appendChild(renderStage1Body(task));
    if(state.stage===2) wrap.appendChild(renderStage2Body(task));
    if(state.stage===3) wrap.appendChild(renderStage3Body(task));

    const bar=document.createElement("div");
    bar.className="action-bar";
    const canSubmit = checkCanSubmit();
    bar.innerHTML = `<span class="hint">${hintText()}</span>`;
    const btn=document.createElement("button");
    btn.className="btn"; btn.textContent="Submit";
    btn.disabled=!canSubmit;
    btn.onclick=submitAnswer;
    bar.appendChild(btn);
    wrap.appendChild(bar);
    return wrap;
  }

  function hintText(){
    if(state.stage===1) return "Drag or tap a role into the ownership slot.";
    if(state.stage===2) return "Drag or tap roles into the slots in the order work should flow.";
    return "Tap up to 4 roles, then tap ★ on the one who should lead.";
  }
  function checkCanSubmit(){
    if(state.stage===1) return !!state.selection;
    if(state.stage===2) return state.seq.every(s=>s!==null);
    if(state.stage===3) return state.chosen.length>0 && !!state.primary;
    return false;
  }

  function renderStage1Body(task){
    const box=document.createElement("div");
    const slotZone=document.createElement("div");
    slotZone.className="slot-zone";
    const slot=document.createElement("div");
    slot.className="slot"+(state.selection? " filled":"");
    if(state.selection) slot.style.setProperty("--rc", R[state.selection].color);
    slot.innerHTML = state.selection
      ? `<span class="emoji">${R[state.selection].emoji}</span> <strong>${R[state.selection].name}</strong> is the primary owner <span class="clear">clear</span>`
      : `Drop the primary owner here`;
    slot.addEventListener("dragover", e=>{e.preventDefault(); slot.classList.add("over");});
    slot.addEventListener("dragleave", ()=>slot.classList.remove("over"));
    slot.addEventListener("drop", e=>{
      e.preventDefault(); slot.classList.remove("over");
      const roleId=e.dataTransfer.getData("text/plain");
      setSelection(roleId);
    });
    if(state.selection){
      slot.querySelector(".clear").onclick=(e)=>{e.stopPropagation(); state.selection=null; render();};
    }
    slotZone.appendChild(slot);
    box.appendChild(slotZone);

    const label=document.createElement("div");
    label.className="pool-label"; label.textContent="Available roles";
    box.appendChild(label);

    const grid=document.createElement("div");
    grid.className="role-grid";
    ROLES.forEach(role=>{
      grid.appendChild(makeRoleCard(role,{
        draggable:true,
        selected: state.selection===role.id,
        onClick:(id)=>setSelection(id)
      }));
    });
    box.appendChild(grid);
    return box;
  }
  function setSelection(id){
    state.selection=id;
    render();
    const slot=document.querySelector(".slot");
    if(slot){slot.classList.add("snap"); setTimeout(()=>slot.classList.remove("snap"),300);}
    beep(520,0.08);
  }

  function renderStage2Body(task){
    const box=document.createElement("div");
    const label=document.createElement("div");
    label.className="pool-label"; label.textContent=`Build the workflow — ${task.order.length} steps`;
    box.appendChild(label);

    const row=document.createElement("div");
    row.className="seq-row";
    state.seq.forEach((val,idx)=>{
      if(idx>0){
        const ar=document.createElement("span"); ar.className="seq-arrow"; ar.textContent="→";
        row.appendChild(ar);
      }
      const slot=document.createElement("div");
      slot.className="seq-slot"+(val? " filled":"");
      if(val) slot.style.setProperty("--rc", R[val].color);
      slot.innerHTML = `<span class="idx">${idx+1}</span>` + (val
        ? `<span class="emoji">${R[val].emoji}</span><span>${R[val].name}</span><span class="clear">clear</span>`
        : `<span>drop here</span>`);
      slot.addEventListener("dragover", e=>{e.preventDefault(); slot.classList.add("over");});
      slot.addEventListener("dragleave", ()=>slot.classList.remove("over"));
      slot.addEventListener("drop", e=>{
        e.preventDefault(); slot.classList.remove("over");
        const roleId=e.dataTransfer.getData("text/plain");
        state.seq[idx]=roleId; render(); beep(520,0.08);
      });
      slot.addEventListener("click", ()=>{
        if(val){ state.seq[idx]=null; render(); return; }
        const firstEmpty = state.seq.findIndex(v=>v===null);
        if(firstEmpty===idx && state.lastPickedRole){
          state.seq[idx]=state.lastPickedRole; render(); beep(520,0.08);
        }
      });
      row.appendChild(slot);
    });
    box.appendChild(row);

    const label2=document.createElement("div");
    label2.className="pool-label"; label2.textContent="Available roles — tap a slot after selecting";
    box.appendChild(label2);

    const grid=document.createElement("div");
    grid.className="role-grid";
    ROLES.forEach(role=>{
      grid.appendChild(makeRoleCard(role,{
        draggable:true,
        selected: state.lastPickedRole===role.id,
        onClick:(id)=>{
          const firstEmpty = state.seq.findIndex(v=>v===null);
          if(firstEmpty!==-1){ state.seq[firstEmpty]=id; render(); beep(520,0.08); }
        }
      }));
    });
    box.appendChild(grid);
    return box;
  }

  function renderStage3Body(task){
    const box=document.createElement("div");
    const label=document.createElement("div");
    label.className="pool-label"; label.textContent=`Select up to 4 roles (${state.chosen.length}/4) — then mark the lead`;
    box.appendChild(label);

    const grid=document.createElement("div");
    grid.className="role-grid";
    ROLES.forEach(role=>{
      const isChosen = state.chosen.includes(role.id);
      const card = makeRoleCard(role,{
        draggable:false,
        selected:isChosen,
        star:isChosen,
        starActive: state.primary===role.id,
        onClick:(id,e,cardEl)=>{
          if(e.target.classList.contains("star")){
            if(state.chosen.includes(id)) state.primary=id;
            render(); return;
          }
          if(state.chosen.includes(id)){
            state.chosen=state.chosen.filter(r=>r!==id);
            if(state.primary===id) state.primary=null;
          } else {
            if(state.chosen.length>=4){
              cardEl.style.transition="transform .1s";
              cardEl.style.transform="translateX(-4px)";
              setTimeout(()=>{cardEl.style.transform="translateX(4px)";},80);
              setTimeout(()=>{cardEl.style.transform="translateX(0)";},160);
              return;
            }
            state.chosen.push(id);
            if(!state.primary) state.primary=id;
          }
          render(); beep(520,0.08);
        }
      });
      grid.appendChild(card);
    });
    box.appendChild(grid);
    return box;
  }

  /* ============ SUBMIT / SCORING ============ */
  function submitAnswer(){
    const task=currentTask();
    let result={};
    if(state.stage===1){
      const correct = state.selection===task.owner;
      const isAssist = task.assist.includes(state.selection);
      result={type:1, correct, isAssist, chosen:state.selection, task,
        score: correct?100:(isAssist?55:15)};
    }
    if(state.stage===2){
      const n=task.order.length;
      let matches=0;
      for(let i=0;i<n;i++) if(state.seq[i]===task.order[i]) matches++;
      const stepDiff = Math.abs(state.seq.length - task.order.length); // always 0 since fixed slots
      result={type:2, matches, n, chosen:state.seq.slice(), task,
        score: Math.round((matches/n)*100),
        delegationSub: 100 - stepDiff*20};
    }
    if(state.stage===3){
      const primaryCorrect = state.primary===task.primary;
      const supportChosen = state.chosen.filter(r=>r!==state.primary);
      const idealSupport = task.support;
      const overlap = supportChosen.filter(r=>idealSupport.includes(r)).length;
      const overlapScore = idealSupport.length? (overlap/idealSupport.length) : 1;
      const score = Math.round((primaryCorrect?50:0) + overlapScore*50);
      const countDelegationSub = (state.chosen.length>=3 && state.chosen.length<=4) ? 100 : (state.chosen.length===2? 65:30);
      result={type:3, primaryCorrect, overlap, idealCount:idealSupport.length,
        chosenCount:state.chosen.length, chosen:state.chosen.slice(), primary:state.primary, task,
        score, delegationSub:countDelegationSub};
    }
    state.results[state.stage].push(result);
    state.phase="reveal";
    render();
    beep(result.score>=70?720:420, 0.12);
  }

  /* ============ REVEAL RENDER ============ */
  function renderReveal(){
    const wrap=document.createElement("div");
    const res = state.results[state.stage][state.results[state.stage].length-1];
    const task=res.task;
    const panel=document.createElement("div");
    panel.className="glass reveal fade-in";

    if(state.stage===1){
      panel.innerHTML = `
        <h4>✓ Primary Owner: <span class="tag-owner">${R[task.owner].emoji} ${R[task.owner].name}</span></h4>
        <p>${task.why}</p>
        <div class="pool-label">May also assist</div>
        <div class="pill-row">${task.assist.map(a=>`<span class="pill">${R[a].emoji} ${R[a].name}</span>`).join("")}</div>
        <div class="pill-row"><span class="pill ${res.correct?'correct':'wrong'}">${res.correct? "You matched the primary owner":"You chose "+R[res.chosen].name}</span></div>
      `;
    }
    if(state.stage===2){
      panel.innerHTML = `<h4>✓ Common Path</h4><p>${task.why}</p>
        <div class="pool-label">Correct flow</div>
        <div class="flow-line">${task.order.map((r,i)=>`<span class="pill correct">${R[r].emoji} ${R[r].name}</span>`+(i<task.order.length-1?'<span class="arrow">→</span>':'')).join("")}</div>
        <div class="pool-label" style="margin-top:14px;">Your flow</div>
        <div class="flow-line">${res.chosen.map((r,i)=>`<span class="pill ${r===task.order[i]?'correct':'wrong'}">${R[r].emoji} ${R[r].name}</span>`+(i<res.chosen.length-1?'<span class="arrow">→</span>':'')).join("")}</div>
      `;
    }
    if(state.stage===3){
      panel.innerHTML = `
        <h4>✓ Primary Owner: <span class="tag-owner">${R[task.primary].emoji} ${R[task.primary].name}</span></h4>
        <div class="pool-label">Supporting teams</div>
        <div class="pill-row">${task.support.map(a=>`<span class="pill">${R[a].emoji} ${R[a].name}</span>`).join("")}</div>
        <p>${task.why}</p>
        <div class="pool-label">Possible communication flow</div>
        <p style="margin-top:-6px;">${task.flow}</p>
        <div class="pool-label">Your assignment</div>
        <div class="pill-row">
          <span class="pill ${res.primaryCorrect?'correct':'wrong'}">Lead: ${R[res.primary].emoji} ${R[res.primary].name}</span>
          ${res.chosen.filter(r=>r!==res.primary).map(r=>`<span class="pill ${task.support.includes(r)?'correct':'wrong'}">${R[r].emoji} ${R[r].name}</span>`).join("")}
        </div>
      `;
    }
    wrap.appendChild(panel);

    const bar=document.createElement("div");
    bar.className="action-bar";
    const isLastOfStage = state.qIndex===2;
    const isLastOfGame = state.stage===3 && isLastOfStage;
    bar.innerHTML = `<span class="hint">Understanding, not just correctness — every answer teaches something.</span>`;
    const btn=document.createElement("button");
    btn.className="btn";
    btn.textContent = isLastOfGame ? "See my dashboard" : (isLastOfStage ? "Next stage" : "Next task");
    btn.onclick=()=>{
      if(isLastOfGame){ state.phase="dashboard"; render(); return; }
      if(isLastOfStage){ state.stage++; state.qIndex=0; state.phase="intro"; }
      else { state.qIndex++; state.phase="question"; }
      resetInputs();
      render();
    };
    bar.appendChild(btn);
    wrap.appendChild(bar);
    return wrap;
  }

  /* ============ SCORING AGGREGATES ============ */
  function computeCategories(){
    const s1=state.results[1], s2=state.results[2], s3=state.results[3];
    const avg=(arr,f)=> arr.length? arr.reduce((a,b)=>a+f(b),0)/arr.length : 0;

    const ownership = avg(s1, r=>r.score);
    const workflow = avg(s2, r=>r.score);
    const collaboration = avg(s3, r=>r.score);
    const delegationParts = [...s2.map(r=>r.delegationSub), ...s3.map(r=>r.delegationSub)];
    const delegation = delegationParts.length? delegationParts.reduce((a,b)=>a+b,0)/delegationParts.length : 0;

    return {
      Ownership: Math.round(ownership),
      Delegation: Math.round(delegation),
      Collaboration: Math.round(collaboration),
      "Workflow Thinking": Math.round(workflow)
    };
  }

  function buildReflection(cats){
    const entries = Object.entries(cats);
    const strongest = entries.reduce((a,b)=> b[1]>a[1]? b:a);
    const weakest = entries.reduce((a,b)=> b[1]<a[1]? b:a);

    const s3 = state.results[3];
    const avgChosenCount = s3.length? s3.reduce((a,r)=>a+r.chosenCount,0)/s3.length : 0;
    const avgOverlap = s3.length? s3.reduce((a,r)=> a + (r.idealCount? r.overlap/r.idealCount : 1),0)/s3.length : 0;

    let overAssign, underCollab;
    if(avgChosenCount<=2){
      overAssign = "In the bigger scenarios, you tended to place responsibility on just one or two roles rather than spreading it across a team — a common instinct, but complex problems often need more hands.";
    } else {
      overAssign = "You generally avoided piling everything onto a single role, which is a healthy sign for how you think about ownership.";
    }
    if(avgOverlap<0.55){
      underCollab = "Even when you brought in extra roles, they weren't always the ones whose expertise mattered most for that situation — worth pausing on who's actually affected before assigning.";
    } else {
      underCollab = "When you did loop in extra roles, they were usually the right ones — you're reading these situations well.";
    }

    const insights = [
      "Many real workplace problems are solved by teams rather than individuals.",
      "Ownership often starts with one person, but resolution usually depends on several.",
      "The person closest to a problem isn't always the one who should lead its fix."
    ];
    const insight = insights[Math.floor(Math.random()*insights.length)];

    return {
      wellText: `You showed the strongest instincts around **${strongest[0]}** (${strongest[1]}/100) — you're reading these situations with a clear sense of who's accountable.`,
      overAssign,
      underCollab,
      insight,
      weakest: weakest[0]
    };
  }

  function renderDashboard(){
    const wrap=document.createElement("div");
    const cats = computeCategories();
    const refl = buildReflection(cats);

    const celebrate=document.createElement("div");
    celebrate.className="confetti-wrap";
    const emojis=["🎉","✨","🏥","💫","🎊"];
    for(let i=0;i<12;i++){
      const c=document.createElement("span");
      c.className="confetti";
      c.textContent=emojis[i%emojis.length];
      c.style.left=(Math.random()*100)+"%";
      c.style.animationDelay=(Math.random()*0.6)+"s";
      celebrate.appendChild(c);
    }
    wrap.appendChild(celebrate);

    const head=document.createElement("div");
    head.className="glass intro fade-in";
    head.innerHTML = `<div class="stage-tag">COMPLETE</div>
      <h2>Organizational Thinking Dashboard</h2>
      <p>Here's how you tend to think about ownership, delegation, collaboration and workflow — based on this run through a healthcare organization.</p>`;
    wrap.appendChild(head);

    const grid=document.createElement("div");
    grid.className="dash-grid";

    const radarCard=document.createElement("div");
    radarCard.className="glass radar-card fade-in";
    radarCard.innerHTML = `<div class="pool-label">Your profile</div>`;
    radarCard.appendChild(buildRadarSVG(cats));
    Object.entries(cats).forEach(([k,v])=>{
      const row=document.createElement("div");
      row.className="cat-row"; row.innerHTML=`<span>${k}</span><span>${v}/100</span>`;
      const barWrap=document.createElement("div"); barWrap.className="cat-bar";
      const bar=document.createElement("i"); barWrap.appendChild(bar);
      radarCard.appendChild(row); radarCard.appendChild(barWrap);
      setTimeout(()=>{bar.style.width=v+"%";},50);
    });
    grid.appendChild(radarCard);

    const reflectCard=document.createElement("div");
    reflectCard.className="glass reflect-card fade-in";
    reflectCard.innerHTML = `
      <h4>What you understood well</h4><p>${refl.wellText}</p>
      <h4>Where you tended to over-assign responsibility</h4><p>${refl.overAssign}</p>
      <h4>Where you underestimated collaboration</h4><p>${refl.underCollab}</p>
      <h4>One insight</h4><p>${refl.insight}</p>
    `;
    grid.appendChild(reflectCard);
    wrap.appendChild(grid);

    const bar=document.createElement("div");
    bar.className="action-bar";
    bar.innerHTML=`<span class="hint">Every path through an organization is a little different.</span>`;
    const replay=document.createElement("button");
    replay.className="btn"; replay.textContent="Replay with new scenarios";
    replay.onclick=newGame;
    bar.appendChild(replay);
    wrap.appendChild(bar);

    return wrap;
  }

  function buildRadarSVG(cats){
    const labels=Object.keys(cats);
    const values=Object.values(cats);
    const n=labels.length;
    const cx=150, cy=140, R=100;
    const pts=values.map((v,i)=>{
      const ang = -Math.PI/2 + i*(2*Math.PI/n);
      const r = (v/100)*R;
      return [cx+r*Math.cos(ang), cy+r*Math.sin(ang)];
    });
    const axisPts=labels.map((l,i)=>{
      const ang = -Math.PI/2 + i*(2*Math.PI/n);
      return [cx+R*Math.cos(ang), cy+R*Math.sin(ang), cx+(R+22)*Math.cos(ang), cy+(R+22)*Math.sin(ang)];
    });
    const ringPath = [0.33,0.66,1].map(f=>{
      const p=labels.map((l,i)=>{
        const ang=-Math.PI/2+i*(2*Math.PI/n);
        return [cx+R*f*Math.cos(ang), cy+R*f*Math.sin(ang)];
      });
      return `<polygon points="${p.map(p=>p.join(",")).join(" ")}" fill="none" stroke="rgba(255,255,255,0.08)"/>`;
    }).join("");
    const dataPoly = `<polygon points="${pts.map(p=>p.join(",")).join(" ")}" fill="rgba(45,212,191,0.22)" stroke="#2dd4bf" stroke-width="2"/>`;
    const axes = axisPts.map(a=>`<line x1="${cx}" y1="${cy}" x2="${a[0]}" y2="${a[1]}" stroke="rgba(255,255,255,0.12)"/>`).join("");
    const texts = axisPts.map((a,i)=>`<text x="${a[2]}" y="${a[3]}" font-size="10.5" fill="#8ea3ad" text-anchor="middle">${labels[i]}</text>`).join("");
    const dots = pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#2dd4bf"/>`).join("");

    const div=document.createElement("div");
    div.innerHTML = `<svg viewBox="0 0 300 280" style="width:100%;max-width:320px;display:block;margin:0 auto;">
      ${ringPath}${axes}${dataPoly}${dots}${texts}
    </svg>`;
    return div;
  }

  /* ============ INIT ============ */
  document.getElementById("soundBtn").addEventListener("click", function(){
    state.soundOn=!state.soundOn;
    this.textContent = state.soundOn? "🔊 Sound on":"🔇 Sound off";
  });

  state.lastPickedRole=null;
  newGame();
})();
</script>
</body>
